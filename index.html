function PhotoThumb({src, fallback, style, onClick, thumbStyle}) {
  const [visible, setVisible] = React.useState(true);
  if (!visible) return null;
  return (
    <div onClick={onClick} style={thumbStyle}>
      <img src={src} alt="" style={style}
        onError={e => {
          if (fallback && e.target.src !== fallback) { e.target.src = fallback; }
          else setVisible(false);
        }}/>
    </div>
  );
}

/* ─── ANIMATED BAR ─── */
function AnimatedBar({targetWidth, color, delay=0, height=24, children}) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    // 即座に幅0にしてトランジションを無効化
    el.style.transition = 'none';
    el.style.width = '0%';
    // ダブルrAFでブラウザに0%を描画させてからアニメーション開始
    const raf1 = requestAnimationFrame(() => {
      const raf2 = requestAnimationFrame(() => {
        el.style.transition = `width 0.5s cubic-bezier(0.4,0,0.2,1) ${delay}ms, background 0.2s`;
        el.style.width = targetWidth;
      });
      return () => cancelAnimationFrame(raf2);
    });
    return () => cancelAnimationFrame(raf1);
  }, [targetWidth]);

  return (
    <div ref={ref} style={{
      height:'100%', width:'0%',
      background: color,
      borderRadius:4,
      display:'flex', alignItems:'center', paddingLeft:8,
      transition:'background 0.2s',
      overflow:'hidden', whiteSpace:'nowrap',
    }}>
      {children}
    </div>
  );
}

/* ─── VEHICLE REGIONAL PRICE CARD ─── */
function VehicleRegionalPrice({vehicle}) {
  const v = vehicle || VEHICLES[0];
  const [period, setPeriod] = useState('6ヶ月');
  const [priceMode, setPriceMode] = useState('market');
  const [hoveredCell, setHoveredCell] = useState(null);
  const [selectedRegion, setSelectedRegion] = useState(null);

  const mults = priceMode === 'auction' ? AUCTION_MULTS[period] : PERIOD_MULTS[period];
  const dealCounts = PERIOD_DEALS[period];

  // 列定義（地域 or 県別モード）
  let colNames, colPrices, colDeals;
  if (selectedRegion) {
    const ri = REGION_NAMES.indexOf(selectedRegion);
    const prefs = REGION_PREFECTURES[selectedRegion];
    const regionBasePrice = Math.round(v.price * mults[ri]);
    const regionBaseDeals = dealCounts[ri];
    const sumMults = prefs.reduce((s, p) => s + p.mult, 0);
    colNames  = prefs.map(p => p.name);
    colPrices = prefs.map(p => Math.round(regionBasePrice * p.mult));
    colDeals  = prefs.map(p => Math.max(0, Math.round(regionBaseDeals * p.mult / sumMults)));
  } else {
    colNames  = REGION_NAMES;
    colPrices = REGION_NAMES.map((_, i) => Math.round(v.price * mults[i]));
    colDeals  = dealCounts;
  }

  // バケット幅を価格帯に応じて自動調整（≒10〜12行になるよう）
  const minP = Math.min(...colPrices);
  const maxP = Math.max(...colPrices);
  const rawRange = maxP * 1.13 - minP * 0.87;
  const BUCKET = rawRange > 4000000 ? 500000
               : rawRange > 1500000 ? 200000
               : rawRange > 600000  ? 100000
               :                       50000;

  const bStart = Math.floor(minP * 0.87 / BUCKET) * BUCKET;
  const bEnd   = Math.ceil(maxP  * 1.13 / BUCKET) * BUCKET;
  const buckets = [];
  for (let p = bEnd - BUCKET; p >= bStart; p -= BUCKET) buckets.push(p);

  const getCount = (bucketP, colP, total) => {
    const sigma = colP * 0.065;
    const mid = bucketP + BUCKET / 2;
    const g = Math.exp(-0.5 * Math.pow((mid - colP) / sigma, 2));
    return Math.max(0, Math.round(total * g * 0.55));
  };

  const matrix = buckets.map(b => colPrices.map((cp, i) => getCount(b, cp, colDeals[i])));
  const maxVal = Math.max(1, ...matrix.flat());

  const cellColor = (val) => {
    if (!val) return { bg: 'transparent', color: 'transparent' };
    const t = val / maxVal;
    if (t >= 0.75) return { bg: '#D84315', color: '#fff' };
    if (t >= 0.55) return { bg: '#EF6C00', color: '#fff' };
    if (t >= 0.35) return { bg: '#FB8C00', color: '#fff' };
    if (t >= 0.18) return { bg: '#FFB300', color: '#5D3A00' };
    return { bg: '#FFE082', color: '#5D3A00' };
  };

  const fmtM = p => {
    const man = p / 10000;
    return man >= 100 ? Math.round(man) + '万円' : man.toFixed(man % 1 === 0 ? 0 : 1) + '万円';
  };

  return (
    <Card style={{padding:'16px 12px'}}>
      {/* ヘッダー */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}>
          {selectedRegion && (
            <button onClick={() => setSelectedRegion(null)}
              style={{background:'none',border:'none',color:C.blue,cursor:'pointer',fontSize:12,
                fontWeight:700,padding:0,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
              ← 全地域
            </button>

          <div style={{fontWeight:700,fontSize:14,whiteSpace:'nowrap'}}>
            {selectedRegion ? `${selectedRegion}の県別相場` : '地域別価格分布'}
          </div>
        </div>

          {['1ヶ月','3ヶ月','6ヶ月','1年'].map(p => (
            <button key={p} onClick={() => setPeriod(p)}
              style={{padding:'3px 8px',borderRadius:4,fontSize:11,fontWeight:600,cursor:'pointer',border:'none',
                background:period===p?'#fff':'transparent',
                color:period===p?C.text:C.textMid,
                boxShadow:period===p?'0 1px 3px rgba(0,0,0,0.12)':'none'}}>
              {p}
            </button>
          ))}
        </div>
      </div>

      {/* 相場モード */}
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        {[['market','📊 カーセンサー相場'],['auction','🔨 オークション相場']].map(([mode,label]) => (
          <button key={mode} onClick={() => setPriceMode(mode)}
            style={{padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',
              border:`1.5px solid ${priceMode===mode?C.blue:C.border}`,
              background:priceMode===mode?C.blue:'#fff',
              color:priceMode===mode?'#fff':C.textMid}}>

          </button>
        ))}
      </div>

      {/* ヒント（地域モード時のみ） */}

        <div style={{fontSize:10,color:C.textLight,marginBottom:8,display:'flex',alignItems:'center',gap:4}}>
          <span>💡</span>地域名をクリックすると県別に切り替えられます
        </div>
      )}

      {/* マトリクステーブル */}
      <div style={{overflowX:'auto',margin:'0 -4px'}}>
        <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
          <thead>
            <tr style={{borderBottom:`2px solid ${C.border}`}}>
              <th style={{width:76,padding:'7px 8px',textAlign:'left',fontSize:10,color:C.textMid,fontWeight:600}}>
                中古車の相場
              </th>
              {colNames.map((name) => (
                <th key={name}
                  onClick={!selectedRegion ? () => setSelectedRegion(name) : undefined}
                  style={{padding:'6px 2px',textAlign:'center',fontSize:12,fontWeight:700,
                    color:!selectedRegion?C.blue:C.text,
                    cursor:!selectedRegion?'pointer':'default',
                    userSelect:'none',transition:'opacity 0.15s'}}
                  onMouseEnter={e => { if(!selectedRegion) e.currentTarget.style.opacity='0.7'; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity='1'; }}>
                  {name}
                  {!selectedRegion && (
                    <div style={{fontSize:8,color:C.textLight,fontWeight:400,marginTop:1}}>▼ 県別</div>
                  )}
                </th>
              ))}
            </tr>
            <tr style={{borderBottom:`1px solid ${C.border}`,background:'#F7F7F7'}}>
              <td style={{padding:'5px 8px',fontSize:10,color:C.textMid}}>
                合計 {colDeals.reduce((s,d)=>s+d,0)}件
              </td>
              {colDeals.map((d,i) => (
                <td key={i} style={{padding:'5px 2px',textAlign:'center',fontSize:11,color:C.textMid,fontWeight:600}}>
                  {d}件
                </td>
              ))}
            </tr>
          </thead>
          <tbody>
            {buckets.map((bucket, ri) => {
              const rowTotal = matrix[ri].reduce((s,vv)=>s+vv,0);
              const isTopBucket = ri === 0;
              return (
                <tr key={bucket} style={{borderBottom:`1px solid #F0F0F0`}}>
                  <td style={{padding:'2px 8px',whiteSpace:'nowrap',verticalAlign:'middle'}}>
                    <div style={{fontSize:11,color:C.text,fontWeight:500}}>
                      {isTopBucket ? fmtM(bucket)+'以上' : fmtM(bucket)+'−'}
                    </div>
                    {rowTotal > 0 && (
                      <div style={{fontSize:10,color:C.textMid}}>{rowTotal}件</div>
                    )}
                  </td>
                  {matrix[ri].map((val, ci) => {
                    const c = cellColor(val);
                    const isHov = hoveredCell && hoveredCell.r===ri && hoveredCell.c===ci;
                    return (
                      <td key={ci}
                        onMouseEnter={() => val>0 && setHoveredCell({r:ri,c:ci})}
                        onMouseLeave={() => setHoveredCell(null)}
                        style={{height:32,textAlign:'center',verticalAlign:'middle',
                          background:isHov?'#1565C0':c.bg,
                          color:isHov?'#fff':c.color,
                          fontWeight:700,fontSize:12,cursor:'default',
                          transition:'background 0.1s',
                          borderLeft:'1px solid #F5F5F5',
                          position:'relative'}}>
                        {val > 0 ? val : ''}
                        {isHov && (
                          <div style={{position:'absolute',bottom:'calc(100% + 4px)',left:'50%',
                            transform:'translateX(-50%)',
                            background:'#1A1A1A',color:'#fff',
                            padding:'4px 8px',borderRadius:5,fontSize:10,
                            whiteSpace:'nowrap',zIndex:100,pointerEvents:'none',
                            boxShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>
                            {colNames[ci]} {fmtM(bucket)}帯：{val}件
                            <div style={{position:'absolute',top:'100%',left:'50%',
                              transform:'translateX(-50%)',
                              borderLeft:'4px solid transparent',
                              borderRight:'4px solid transparent',
                              borderTop:'4px solid #1A1A1A'}}/>
                          </div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 凡例 */}
      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:10,paddingTop:8,borderTop:`1px solid ${C.borderLight}`}}>
        <span style={{fontSize:10,color:C.textMid,flexShrink:0}}>少ない</span>
        <div style={{display:'flex',gap:2,flex:1}}>
          {['#FFE082','#FFB300','#FB8C00','#EF6C00','#D84315'].map(c => (
            <div key={c} style={{flex:1,height:10,background:c,borderRadius:2}}/>
          ))}
        </div>
        <span style={{fontSize:10,color:C.textMid,flexShrink:0}}>多い</span>
        <span style={{fontSize:10,color:C.textLight,marginLeft:8,flexShrink:0}}>{period}集計</span>
      </div>
    </Card>
  );
}

/* ─── BUYER: 車両一覧 ─── */
function BuyerList({setScreen, setSelectedVehicle}) {
  const [searchVin, setSearchVin] = useState('');
  const [searchMaker, setSearchMaker] = useState('');
  const [searchAppraisalStatus, setSearchAppraisalStatus] = useState('');
  const [searchContractStatus, setSearchContractStatus] = useState('');
  const [filtered, setFiltered] = useState(VEHICLES);

  const doSearch = () => {
    setFiltered(VEHICLES.filter(v => {
      if(searchVin && !v.vin.includes(searchVin) && !v.name.includes(searchVin) && !v.appraisalNo.includes(searchVin)) return false;
      if(searchMaker && !v.maker.includes(searchMaker)) return false;
      if(searchAppraisalStatus && v.appraisalStatus !== searchAppraisalStatus) return false;
      if(searchContractStatus && v.contractStatus !== searchContractStatus) return false;
      return true;
    }));
  };

  const doClear = () => {
    setSearchVin(''); setSearchMaker(''); setSearchAppraisalStatus(''); setSearchContractStatus('');
    setFiltered(VEHICLES);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,padding:24}}>
      {/* Search */}
      <Card>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
            <button style={{height:36,padding:'0 14px',background:'#fff',border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,cursor:'pointer',color:C.textMid,whiteSpace:'nowrap'}}>🏪 店舗選択</button>
            <Input label="メーカー" value={searchMaker} onChange={e=>setSearchMaker(e.target.value)} placeholder="例: BMW" style={{width:140}}/>
            <Input label="担当者" value="" onChange={()=>{}} placeholder="担当者名" style={{width:140}}/>
            <Input label="更新日" value="" onChange={()=>{}} type="date" style={{width:150}}/>
            <Input label="車台番号・車種名" value={searchVin} onChange={e=>setSearchVin(e.target.value)} placeholder="VINまたは車種名" style={{width:200}}/>
          </div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
            <SelectField label="査定ステータス" value={searchAppraisalStatus} onChange={e=>setSearchAppraisalStatus(e.target.value)}
              options={[{value:'',label:'すべて'},...Object.keys(APPRAISAL_STATUS_COLORS).map(k=>({value:k,label:k}))]} style={{width:150}}/>
            <SelectField label="契約結果ステータス" value={searchContractStatus} onChange={e=>setSearchContractStatus(e.target.value)}
              options={[{value:'',label:'すべて'},...Object.keys(CONTRACT_STATUS_COLORS).map(k=>({value:k,label:k}))]} style={{width:160}}/>
            <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
              <Btn onClick={doSearch}>検索</Btn>
              <Btn variant="ghost" onClick={doClear}>クリア</Btn>
            </div>
          </div>
        </div>
      </Card>

      {/* Table */}
      <Card p={0}>
        <div style={{padding:'10px 16px',background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:13,color:C.textMid}}>{filtered.length}件</span>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['査定番号 / ステータス','','メーカー / 車種名 / グレード','車体番号','初度登録','走行距離 / メーター','店舗 / 担当者','出品情報'].map((h,i) => (
                <th key={i} style={{padding:'12px 14px',textAlign:'left',fontSize:13,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(v => (
              <tr key={v.id} style={{borderBottom:`1px solid ${C.borderLight}`,cursor:'pointer'}}
                onMouseEnter={e => e.currentTarget.style.background='#FAFAFA'}
                onMouseLeave={e => e.currentTarget.style.background='#fff'}
                onClick={() => { setSelectedVehicle(v); setScreen('buyer-detail'); }}>

                    <StatusBadge status={v.appraisalStatus} type="appraisal"/>
                    {v.contractStatus && <div style={{marginTop:2}}><StatusBadge status={v.contractStatus} type="contract"/></div>}
                  </div>
                </td>
                <td style={{padding:'14px 8px',width:108}}>
                  <WikiImage wikiImg={v.wikiImg} fallback={v.img} style={{width:96,height:66,borderRadius:4,objectFit:'cover',display:'block'}}/>
                </td>
                <td style={{padding:'14px 14px'}}>
                  <div style={{fontSize:13,color:C.textMid}}>{v.maker}</div>
                  <div style={{fontSize:16,fontWeight:700,color:C.text}}>{v.name}</div>

/* ─── BUYER: 通知一覧 ─── */
function Notifications() {
  const [tab, setTab] = useState('all');
  const [notifs, setNotifs] = useState(NOTIFICATIONS);
  const tabs = [['all','すべて'],['unread','未読'],['bid','入札・落札取引'],['system','システム']];
  const filtered = notifs.filter(n => {
    if(tab==='unread') return !n.read;
    if(tab==='bid') return n.type.includes('入札');
    if(tab==='system') return n.type==='システム';
    return true;
  });
  return (
    <div style={{padding:24,maxWidth:800}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',background:C.borderLight,borderRadius:6,padding:2,gap:1}}>
          {tabs.map(([v,l]) => (
            <button key={v} onClick={() => setTab(v)}
              style={{padding:'6px 14px',borderRadius:4,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
                background:tab===v?'#fff':'transparent',color:tab===v?C.red:C.textMid,
                boxShadow:tab===v?'0 1px 4px rgba(0,0,0,0.08)':'none'}}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={() => setNotifs(prev => prev.map(n => ({...n,read:true})))}
          style={{background:'none',border:`1px solid ${C.border}`,color:C.textMid,borderRadius:6,padding:'6px 14px',fontSize:12,cursor:'pointer'}}>
          すべて既読にする
        </button>
      </div>
      <Card p={0}>
        {filtered.length===0 && <div style={{padding:48,textAlign:'center',color:C.textLight}}>通知はありません</div>}
        {filtered.map((n,i) => (
          <div key={n.id} onClick={() => setNotifs(prev => prev.map(x => x.id===n.id?{...x,read:true}:x))}
            style={{display:'flex',gap:12,padding:'14px 16px',borderBottom:i<filtered.length-1?`1px solid ${C.borderLight}`:'none',
              borderLeft:`3px solid ${n.read?'transparent':C.red}`,cursor:'pointer',

// 地域ごとのスケール係数（全国=1.0）
const SOUBA_REGION_SCALE = {'全国':1.0,'関東':0.42,'関西':0.28,'東海':0.18,'九州':0.14};

function getSoubaMatrix(model, region) {
  const base = SOUBA_BASE[model];
  const scale = SOUBA_REGION_SCALE[region];
  return base.map(row => row.map(v => Math.max(0, Math.round(v * scale))));
}

function SoubaMatrix() {
  const [model, setModel] = useState('Audi A4');
  const [region, setRegion] = useState('全国');
  const matrix = getSoubaMatrix(model, region);
  const maxVal = Math.max(1, ...matrix.flat());
  const rowTotals = matrix.map(row => row.reduce((s,v) => s+v, 0));
  const totalCars = rowTotals.reduce((s,v) => s+v, 0);

  const getCellStyle = (val) => {
    if (val === 0) return {background:'transparent', color:'transparent'};
    const ratio = val / maxVal;
    const r = 255;
    const g = Math.round(243 - ratio * (243 - 101));
    const b = Math.round(224 - ratio * 224);
    return {
      background: `rgb(${r},${g},${b})`,
      color: ratio > 0.55 ? '#fff' : '#7B3A10',
      fontWeight: 700,
    };
  };

                <td style={{padding:'6px 12px',textAlign:'right',fontSize:13,fontWeight:700,color:C.blue,whiteSpace:'nowrap',borderRight:`1px solid ${C.border}`}}>

                </td>
                <td style={{padding:'6px 8px',textAlign:'center',fontSize:11,color:C.textMid,fontWeight:600,borderRight:`1px solid ${C.border}`,background:'#FAFAFA'}}>
                  {rowTotals[ri] > 0 ? `${rowTotals[ri]}台` : ''}
                </td>
                {matrix[ri].map((val, ci) => {
                  const cs = getCellStyle(val);
                  return (
                    <td key={ci} style={{
                      padding:'6px 4px', textAlign:'center', fontSize:12,
                      width:64, minWidth:48,
                      background: cs.background, color: cs.color, fontWeight: cs.fontWeight,
                      border:`1px solid ${C.borderLight}`,
                      transition:'background 0.25s, outline 0.1s',
                      cursor: val > 0 ? 'pointer' : 'default',
                    }}
                    onMouseEnter={e => { if(val>0) { e.currentTarget.style.outline=`2px solid #E65100`; e.currentTarget.style.zIndex='1'; }}}
                    onMouseLeave={e => { e.currentTarget.style.outline='none'; e.currentTarget.style.zIndex=''; }}>
                      {val > 0 ? val : ''}
                    </td>
                  );
                })}
              </tr>
            ))}
            {/* 合計行 */}
            <tr style={{borderTop:`2px solid ${C.border}`,background:'#FAFAFA'}}>
              <td style={{padding:'6px 12px',textAlign:'right',fontSize:11,color:C.textMid,fontWeight:600,borderRight:`1px solid ${C.border}`}}>合計</td>
              <td style={{padding:'6px 8px',textAlign:'center',fontSize:11,fontWeight:700,borderRight:`1px solid ${C.border}`}}>{totalCars > 0 ? `${totalCars}台` : ''}</td>
              {SOUBA_YEARS.map((_, ci) => {
                const colTotal = matrix.reduce((s,row) => s+row[ci], 0);
                return (
                  <td key={ci} style={{padding:'6px 4px',textAlign:'center',fontSize:11,color:C.textMid,fontWeight:600,border:`1px solid ${C.borderLight}`}}>
                    {colTotal > 0 ? colTotal : ''}
                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </Card>
  );
}

/* ─── 入札ポップアップ ─── */
function PurchaseModal({vehicle, modalType, onClose}) {
  const [amount, setAmount] = useState(String(vehicle.currentBid ? vehicle.currentBid + 100000 : vehicle.startPrice));
  const [submitted, setSubmitted] = useState(false);
  const [error, setError] = useState('');

  const numAmount = Number(amount.replace(/,/g, ''));
  const minBid = vehicle.currentBid ? vehicle.currentBid + 1 : vehicle.startPrice;

  const handleAmountChange = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, '');
    setAmount(raw);
    setError('');
  };

  const handleSubmit = () => {
    if (modalType === 'auction' && numAmount <= vehicle.currentBid) {
      setError(`現在の入札額（${fmt(vehicle.currentBid)}）より高い金額を入力してください`);
      return;
    }
    if (!numAmount || numAmount < 1000) {
      setError('有効な金額を入力してください');
      return;
    }
    setSubmitted(true);
  };

  const isAuction = modalType === 'auction';

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}
      onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div style={{background:'#fff',borderRadius:12,width:'100%',maxWidth:480,boxShadow:'0 20px 60px rgba(0,0,0,0.25)',overflow:'hidden',animation:'fadeInDown 0.2s ease both'}}>

        {/* ヘッダー */}
        <div style={{background: C.blue, padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{color:'#fff',fontWeight:700,fontSize:16}}>入札する</div>
            <div style={{color:'rgba(255,255,255,0.8)',fontSize:12,marginTop:2}}>{vehicle.maker} {vehicle.name} {vehicle.grade}</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:6,width:32,height:32,color:'#fff',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>

        <div style={{padding:24}}>
          {!submitted ? (
            <>
              {/* 車両サマリー */}
              <div style={{display:'flex',gap:12,alignItems:'center',padding:'12px 14px',background:'#F8F8F8',borderRadius:8,marginBottom:20}}>
                <WikiImage wikiImg={vehicle.wikiImg} fallback={vehicle.img} style={{width:72,height:50,borderRadius:4,objectFit:'cover',flexShrink:0}}/>
                <div>
                  <div style={{fontSize:13,fontWeight:700}}>{vehicle.maker} {vehicle.name}</div>
                  <div style={{fontSize:11,color:C.textMid}}>{vehicle.registration} · {vehicle.mileage.toLocaleString()}km</div>
                  <div style={{fontSize:11,color:C.textMid}}>{vehicle.store}</div>
                </div>
              </div>

              {/* AI予想小売価格 */}

                <span style={{fontSize:20}}>✨</span>
                <div>
                  <div style={{fontSize:11,color:'#5a3d8a',fontWeight:600,marginBottom:1}}>AI予想小売価格</div>
                  <div style={{fontSize:17,fontWeight:800,color:'#5a3d8a'}}>{fmt(Math.round((vehicle.currentBid||vehicle.startPrice) * 1.35 / 10000) * 10000)}</div>

                <div style={{fontSize:11,color:'#7c5cbf',marginLeft:'auto',textAlign:'right',lineHeight:1.4}}>市場データ<br/>に基づく予測</div>

                {isAuction && (
                  <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
                    {[100000,500000,1000000].map(step => (
                      <button key={step} onClick={() => { setAmount(String(numAmount + step)); setError(''); }}

                          background:'#EFF6FF',color:C.blue,cursor:'pointer'}}>

/* ─── PAGE TITLES ─── */
const PAGE_TITLES = {
  'home':'OnePrice',
  'buyer-list':'査定 / 車両一覧',
  'buyer-detail':'車両詳細',
  'tx-list':'取引中（購入）',
  'tx-detail':'取引詳細',
  'notifications':'通知一覧',
  'mypage':'マイページ',
  'seller-list':'出品管理',
  'seller-detail':'車両詳細（出品）',
  'unlisted-list':'購入',
  'unlisted-detail':'車両詳細（購入）',
  'price-negotiation':'価格交渉',
  'admin-dashboard':'ダッシュボード',
  'admin-regional':'地域別価格分析',
};

/* ─── APP ROOT ─── */
function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [role, setRole] = useState('user');
  const [screen, setScreen] = useState('home');
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [selectedUnlisted, setSelectedUnlisted] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const handleLogin = r => {
    setRole(r);
    setScreen(r==='admin'?'admin-dashboard':'home');
    setLoggedIn(true);
  };

  if(!loggedIn) return <LoginScreen onLogin={handleLogin}/>;

  const renderScreen = () => {
    switch(screen) {
      case 'home': return <HomeScreen setScreen={setScreen}/>;
      case 'buyer-list': return <BuyerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'buyer-detail': return <BuyerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'tx-list': return <TxList setScreen={setScreen}/>;
      case 'tx-detail': return <TxDetail setScreen={setScreen}/>;
      case 'notifications': return <Notifications/>;
      case 'mypage': return <MyPage/>;
      case 'seller-list': return <SellerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'seller-detail': return <SellerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'unlisted-list': return <UnlistedList setScreen={setScreen} setSelectedUnlisted={setSelectedUnlisted}/>;
      case 'unlisted-detail': return <UnlistedDetail vehicle={selectedUnlisted} setScreen={setScreen}/>;
      case 'price-negotiation': return <PriceNegotiation vehicle={selectedUnlisted} setScreen={setScreen}/>;
      case 'admin-dashboard': return <AdminDashboard setScreen={setScreen}/>;
      case 'admin-regional': return <AdminRegional/>;
      default: return <HomeScreen setScreen={setScreen}/>;
    }
  };

  const title = screen === 'home' ? '' : (PAGE_TITLES[screen] || 'OnePrice');
  const purchaseScreens = ['unlisted-list','unlisted-detail','price-negotiation'];
  const accentColor = purchaseScreens.includes(screen) ? C.blue : C.red;

  return (
    <div style={{minHeight:'100vh',background:C.bg}}>
      <Sidebar role={role} screen={screen} setScreen={setScreen} setRole={setRole}
        open={sidebarOpen} onClose={() => setSidebarOpen(false)}/>
      <TopBar title={title} setScreen={setScreen} role={role} onMenuClick={() => setSidebarOpen(true)} accentColor={accentColor}/>
      <div style={{overflowY:'auto',overflowX:'hidden'}}>
        {renderScreen()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
