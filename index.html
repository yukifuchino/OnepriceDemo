const PERIOD_MAX_DAYS = {'日別':1,'週別':7,'月別':30,'年別':365};

function AppraisalDashboard({setScreen, setSelectedVehicle}) {
  const openVehicle = v => { setSelectedVehicle(v); setScreen('buyer-detail'); };
  const [activeKpi, setActiveKpi] = useState('all');
  const [periodTab, setPeriodTab] = useState('月別');
  const [storeFilter, setStoreFilter] = useState('');
  const [staffFilter, setStaffFilter] = useState('');
  const [alertModal, setAlertModal] = useState(false);
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo,   setDateTo]   = useState('');

  const toDisplayStatus = s => ({'査定待ち':'査定待ち','査定済':'査定済','商談中':'商談中','交渉済':'商談済','下書き':'商談済'}[s]||s);

  const KPI_DEF = [
    {key:'査定待ち', color:'#2563EB', bg:'#EFF6FF', icon:'list'},
    {key:'査定済',   color:'#047857', bg:'#ECFDF5', icon:'check'},
    {key:'商談中',   color:'#D97706', bg:'#FFFBEB', icon:'message'},
    {key:'商談済',   color:'#475569', bg:'#F1F5F9', icon:'flag'},
  ];

  const maxDays = PERIOD_MAX_DAYS[periodTab] || 9999;

  /* 期間・店舗・担当者すべてを考慮したベース車両リスト */
  const baseDash = ALL_DASH.filter(v => {
    const el = ELAPSED[v.id];
    if (!el) return false;
    if (dateFrom || dateTo) {
      /* カスタム期間範囲モード（タブ別キー比較） */
      const d = new Date(Date.now() - el.daysAgo * 86400 * 1000);
      let vKey;
      if (periodTab==='日別') {
        vKey = d.toISOString().slice(0,10);
      } else if (periodTab==='週別') {
        const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        vKey = `${ym}-${Math.ceil(d.getDate()/7)}`;
      } else if (periodTab==='月別') {
        vKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      } else {
        vKey = String(d.getFullYear());
      }
      if (dateFrom && vKey < dateFrom) return false;
      if (dateTo   && vKey > dateTo)   return false;
    } else {
      /* タブモード */
      if (el.daysAgo > maxDays) return false;
    }
    if (storeFilter && v.store !== storeFilter) return false;
    if (staffFilter && v.assignee !== staffFilter) return false;
    return true;
  });

  const kpiCount = key => baseDash.filter(v => toDisplayStatus(v.appraisalStatus) === key).length;

  const alertVehicles = ALL_DASH
    .filter(v => (ELAPSED[v.id]||{}).level >= 2)
    .sort((a,b) => (ELAPSED[b.id]?.hours||0) - (ELAPSED[a.id]?.hours||0));

  const alertCount = alertVehicles.length;

  const stores = [...new Set(ALL_DASH.map(v => v.store))];
  const staffs = [...new Set(ALL_DASH.map(v => v.assignee))];

  const filtered = baseDash.filter(v =>
    activeKpi === 'all' || toDisplayStatus(v.appraisalStatus) === activeKpi
  );

  const elColor = lvl => lvl >= 2 ? C.danger : lvl === 1 ? C.warning : C.textMid;

  /* 出口の比率：いま絞り込んでいる店舗の車両を、小売とAAのどちらに出すべきか */
  const exitRows = baseDash.filter(v => v.price > 0 && v.retailPrice > 0 && v.auctionPrice > 0);
  const exitBins = rate => [
    {label:'粗利15%以上', pick:v => rate(v) >= 0.15,                  color:C.success},
    {label:'8〜15%',     pick:v => rate(v) >= 0.08 && rate(v) < 0.15, color:C.info},
    {label:'8%未満',     pick:v => rate(v) > 0    && rate(v) < 0.08,  color:C.warning},
    {label:'赤字',       pick:v => rate(v) <= 0,                      color:C.danger},
  ].map(b => ({...b, rows: exitRows.filter(b.pick)}));
  const exitOnlyRetail = exitRows.filter(v => v.retailPrice > v.price && v.auctionPrice <= v.price);


  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>

      {/* タイトル行 */}
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <button onClick={() => setScreen('home')}
          style={{background:'none',border:'none',color:C.textMid,cursor:'pointer',fontSize:13,padding:0,fontWeight:500}}>
          ← ホーム
        </button>
        <div style={{fontSize:20,fontWeight:800,color:C.text}}>査定</div>
        <span style={{fontSize:12,color:C.textMid,marginLeft:'auto'}}>最終更新: 5分前</span>
      </div>

      {/* 放置アラート */}
      {alertCount > 0 && (
        <div style={{background:C.dangerLight,border:`1px solid ${C.danger}33`,borderLeft:`4px solid ${C.danger}`,
          borderRadius:4,padding:'14px 18px',display:'flex',alignItems:'center',gap:14}}>
          <Icon name="alert" size={22} color={C.danger}/>
          <div style={{flex:1}}>
            <span style={{fontWeight:700,color:C.danger,fontSize:14}}>放置アラート　</span>
            <span style={{fontSize:14,color:C.text}}>現在、<strong>2日以上</strong>放置されている査定が </span>
            <span style={{fontSize:20,fontWeight:800,color:C.danger}}>{alertCount}</span>
            <span style={{fontSize:14,color:C.text}}> 件あります。早急に対応してください。</span>
          </div>
          <button onClick={() => setAlertModal(true)}
            style={{padding:'6px 14px',borderRadius:4,border:`1px solid ${C.danger}`,background:'#fff',
              color:C.danger,fontSize:12,fontWeight:700,cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'}}>
            該当案件を見る →
          </button>
        </div>
      )}

      {/* フィルター */}
      <Card>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {/* 行1: プリセットタブ ＋ カスタム期間 */}
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
            <span style={{fontSize:12,color:C.textMid,fontWeight:600,whiteSpace:'nowrap'}}>期間</span>
            <div style={{display:'flex',background:'#F0F0F0',borderRadius:4,padding:3,gap:2}}>
              {['日別','週別','月別','年別'].map(t => (
                <button key={t} onClick={() => { setPeriodTab(t); setDateFrom(''); setDateTo(''); setActiveKpi('all'); }}
                  style={{padding:'5px 14px',borderRadius:4,fontSize:12,fontWeight:600,cursor:'pointer',border:'none',
                    background:periodTab===t?'#fff':'transparent',
                    color:periodTab===t?C.text:C.textMid,
                    boxShadow:periodTab===t?'0 1px 3px rgba(0,0,0,0.12)':'none',
                    transition:'all 0.15s'}}>
                  {t}
                </button>
              ))}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <PeriodDatePicker tab={periodTab} value={dateFrom} onChange={v=>{setDateFrom(v);setActiveKpi('all');}}/>
              <span style={{fontSize:12,color:C.textMid,fontWeight:600}}>〜</span>
              <PeriodDatePicker tab={periodTab} value={dateTo}   onChange={v=>{setDateTo(v);setActiveKpi('all');}}/>
              {(dateFrom||dateTo) && (
                <button onClick={()=>{setDateFrom('');setDateTo('');setActiveKpi('all');}}
                  style={{fontSize:11,color:C.textMid,background:'#F0F0F0',border:'none',borderRadius:4,
                    padding:'4px 8px',cursor:'pointer',whiteSpace:'nowrap'}}>× クリア</button>
              )}
            </div>
          </div>
          {/* 行2: 店舗・担当者 */}
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
            <SelectField label="店舗" value={storeFilter} onChange={e=>{setStoreFilter(e.target.value);setActiveKpi('all');}}
              options={[{value:'',label:'全店舗'},...stores.map(s=>({value:s,label:s}))]} style={{width:160}}/>
            <SelectField label="担当者" value={staffFilter} onChange={e=>{setStaffFilter(e.target.value);setActiveKpi('all');}}
              options={[{value:'',label:'全担当者'},...staffs.map(s=>({value:s,label:s}))]} style={{width:160}}/>
            {(storeFilter||staffFilter) && (
              <Btn variant="ghost" onClick={()=>{setStoreFilter('');setStaffFilter('');setActiveKpi('all');}}>クリア</Btn>
            )}
          </div>
        </div>
      </Card>

      {/* KPI カード */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16}}>
        {KPI_DEF.map(kpi => {
          const count = kpiCount(kpi.key);
          const active = activeKpi === kpi.key;
          return (
            <div key={kpi.key} onClick={() => setActiveKpi(active?'all':kpi.key)}
              style={{borderRadius:8,padding:'20px 22px',cursor:'pointer',userSelect:'none',
                border:`1px solid ${active?kpi.color:C.border}`,
                background:active?kpi.bg:'#fff',
                boxShadow:active?`0 0 0 3px ${kpi.color}1a`:'0 1px 2px rgba(15,23,42,0.04)',
                transition:'all 0.15s'}}>
              <div style={{fontSize:12,fontWeight:600,color:kpi.color,marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
                <Icon name={kpi.icon} size={14} color={kpi.color}/>{kpi.key}
              </div>
              <div style={{fontSize:44,fontWeight:700,color:active?kpi.color:C.text,lineHeight:1,marginBottom:4,letterSpacing:'-0.03em'}}>
                {count}
              </div>
              <div style={{fontSize:11,color:C.textMid,display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
                <span>件</span>
                {active
                  ? <span style={{fontSize:11,color:kpi.color,fontWeight:600}}>絞込中</span>
                  : <span style={{fontSize:11,color:C.textLight}}>クリックで絞込</span>
                }
              </div>
            </div>
          );
        })}
      </div>

      {/* 出口の比率（小売 / AA）── 自店舗の車両をどちらに出すべきか */}
      {exitRows.length > 0 && (
        <Card>
          <div style={{display:'flex',alignItems:'baseline',marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:14}}>出口の比率</div>
            <span style={{fontSize:11,color:C.textMid,marginLeft:10}}>
              {storeFilter || '全店舗'} · 対象 {exitRows.length}台 ·
              小売（カーセンサー相場）と AA（オークション相場）で粗利がどう変わるか
            </span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[
              {name:'小売に出した場合', bins:exitBins(v=>(v.retailPrice-v.price)/v.retailPrice),   key:'小売'},
              {name:'AAに流した場合',   bins:exitBins(v=>(v.auctionPrice-v.price)/v.auctionPrice), key:'AA'},
            ].map(x => (
              <div key={x.key} style={{border:`1px solid ${C.border}`,borderRadius:8,padding:'14px 16px'}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>{x.name}</div>
                {/* 儲かる順に上から並べる。左右で同じ基準（母数）に揃えて比較できるようにする */}
                <StageBars total={exitRows.length} scaleByTotal showZero compact
                  segments={x.bins.map(b => ({
                    label:b.label, count:b.rows.length, color:b.color,
                    desc:`${x.name}に${b.label}となる車両`,
                  }))}/>
              </div>
            ))}
          </div>
          {exitOnlyRetail.length > 0 && (
            <div style={{marginTop:14,display:'flex',alignItems:'center',gap:10,
              padding:'10px 14px',background:C.warningLight,borderRadius:6}}>
              <Icon name="alert" size={16} color={C.warning}/>
              <div style={{fontSize:12,color:C.warning,lineHeight:1.6}}>
                <strong>{exitOnlyRetail.length}台</strong> は小売なら黒字ですが、AAに流すと赤字になります
              </div>
            </div>
          )}
        </Card>
      )}

      {/* 詳細テーブル */}
      <Card p={0}>
        <div style={{padding:'12px 18px',borderBottom:`1px solid ${C.border}`,
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontSize:14,fontWeight:700}}>
            {activeKpi==='all'?'全案件一覧':`「${activeKpi}」案件一覧`}
            <span style={{fontSize:13,fontWeight:400,color:C.textMid,marginLeft:8}}>{filtered.length}件</span>
          </div>
          {activeKpi!=='all' && (
            <button onClick={()=>setActiveKpi('all')}
              style={{background:'none',border:'none',color:C.textMid,cursor:'pointer',fontSize:12,padding:0}}>
              ✕ 絞込解除
            </button>
          )}
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['車種 / 年式','店舗 / 担当者','ステータス','滞留時間'].map(h => (
                <th key={h} style={{padding:'10px 18px',textAlign:'left',fontSize:12,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(v => {
              const el = ELAPSED[v.id]||{hours:1,label:'1時間経過',level:0};
              const rowAlert = el.level >= 2;
              return (
                <tr key={v.id} onClick={()=>openVehicle(v)}
                  style={{borderBottom:`1px solid ${C.borderLight}`,background:rowAlert?C.dangerLight:'#fff',transition:'background 0.15s',cursor:'pointer'}}
                  onMouseEnter={e=>e.currentTarget.style.background=rowAlert?'#FEE2E2':'#FAFAFA'}
                  onMouseLeave={e=>e.currentTarget.style.background=rowAlert?C.dangerLight:'#fff'}>
                  <td style={{padding:'13px 18px'}}>
                    <div style={{fontWeight:700,fontSize:14}}>{v.maker} {v.name}</div>
                    <div style={{fontSize:12,color:C.textMid,marginTop:2}}>{v.grade} · {v.registration}</div>
                    {v.vin && <div style={{fontSize:11,color:C.textLight,fontFamily:'monospace',marginTop:2}}>車台No. …{v.vin.slice(-6)}</div>}
                  </td>
                  <td style={{padding:'13px 18px'}}>
                    <div style={{fontSize:13,color:C.text}}>{v.store}</div>
                    <div style={{fontSize:12,color:C.textMid,marginTop:2}}>{v.assignee}</div>
                  </td>
                  <td style={{padding:'13px 18px'}}>
                    <StatusBadge status={v.appraisalStatus} type="appraisal"/>
                  </td>
                  <td style={{padding:'13px 18px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,
                      color:elColor(el.level),fontWeight:el.level>0?700:400,fontSize:13}}>
                      {el.level>=2 && <Icon name="alert" size={14} color={C.danger}/>}
                      {el.level===1 && <Icon name="warn" size={14} color={C.warning}/>}
                      {el.label}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>

      {/* 放置アラート ポップアップ */}
      {alertModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:500,
          display:'flex',alignItems:'center',justifyContent:'center',padding:32,animation:'fadeInOverlay 0.15s ease both'}}
          onClick={e=>{if(e.target===e.currentTarget)setAlertModal(false);}}>
          <div style={{background:'#fff',borderRadius:12,width:'100%',maxWidth:720,maxHeight:'82vh',
            display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(0,0,0,0.22)',animation:'fadeInDown 0.2s ease both'}}>
            {/* モーダルヘッダー */}
            <div style={{padding:'18px 24px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
              <Icon name="alert" size={22} color={C.danger}/>
              <div style={{flex:1}}>
                <div style={{fontSize:16,fontWeight:800,color:C.danger}}>放置案件一覧</div>
                <div style={{fontSize:12,color:C.textMid,marginTop:2}}>2日以上放置されている案件 · 滞留時間の長い順</div>
              </div>
              <div style={{background:C.dangerLight,color:C.danger,fontWeight:800,fontSize:20,
                padding:'4px 14px',borderRadius:4,marginRight:8}}>
                {alertCount}件
              </div>
              <button onClick={()=>setAlertModal(false)}
                style={{width:32,height:32,borderRadius:'50%',border:`1px solid ${C.border}`,
                  background:'#fff',cursor:'pointer',fontSize:18,color:C.textMid,
                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>✕</button>
            </div>
            {/* モーダルテーブル */}
            <div style={{overflowY:'auto',flex:1}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead style={{position:'sticky',top:0,zIndex:1}}>
                  <tr style={{background:'#FAFAFA',borderBottom:`2px solid ${C.border}`}}>
                    {['順位','車種 / 年式','店舗 / 担当者','ステータス','滞留時間'].map(h => (
                      <th key={h} style={{padding:'10px 16px',textAlign:'left',fontSize:12,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {alertVehicles.map((v,i) => {
                    const el = ELAPSED[v.id];
                    return (
                      <tr key={v.id} onClick={()=>{setAlertModal(false);openVehicle(v);}}
                        style={{borderBottom:`1px solid ${C.borderLight}`,background:i===0?C.dangerLight:'#FEF7F7',cursor:'pointer'}}
                        onMouseEnter={e=>e.currentTarget.style.background='#FEE2E2'}
                        onMouseLeave={e=>e.currentTarget.style.background=i===0?C.dangerLight:'#FEF7F7'}>
                        <td style={{padding:'12px 16px',textAlign:'center'}}>
                          <div style={{width:28,height:28,borderRadius:'50%',
                            background:i===0?C.danger:i<=2?'#DC2626':'#EF4444',
                            color:'#fff',fontWeight:800,fontSize:13,
                            display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto'}}>
                            {i+1}
                          </div>
                        </td>
                        <td style={{padding:'12px 16px'}}>
                          <div style={{fontWeight:700,fontSize:14,color:C.text}}>{v.maker} {v.name}</div>
                          <div style={{fontSize:12,color:C.textMid,marginTop:1}}>{v.grade} · {v.registration}</div>
                          {v.vin && <div style={{fontSize:11,color:C.textLight,fontFamily:'monospace',marginTop:1}}>車台No. …{v.vin.slice(-6)}</div>}
                        </td>
                        <td style={{padding:'12px 16px'}}>
                          <div style={{fontSize:13,color:C.text}}>{v.store}</div>
                          <div style={{fontSize:12,color:C.textMid,marginTop:1}}>{v.assignee}</div>
                        </td>
                        <td style={{padding:'12px 16px'}}>
                          <StatusBadge status={v.appraisalStatus} type="appraisal"/>
                        </td>
                        <td style={{padding:'12px 16px'}}>
                          <div style={{display:'flex',alignItems:'center',gap:6,color:C.danger,fontWeight:700,fontSize:14}}>
                            <Icon name="alert" size={14} color={C.danger}/>{el.label}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


/* ─── HOME SCREEN ─── */
function HomeScreen({setScreen}) {
  const tiles = [
    {
      id: 'satei',
      icon: 'search',
      label: '査定',
      sub: 'Assessment',
      color: C.success,
      lightColor: C.successLight,
      target: 'appraisal-dashboard',
      disabled: false,
    },
    {
      id: 'listing',
      icon: 'upload',
      label: '出品',
      sub: 'Listing',
      color: C.primary,
      lightColor: C.primaryLight,
      target: 'seller-list',
    },
    {
      id: 'purchase',
      icon: 'cart',
      label: '購入',
      sub: 'Purchase',
      color: C.info,
      lightColor: C.infoLight,
      target: 'unlisted-list',
    },
    {
      id: 'board',
      icon: 'trending',
      label: '管理ボード',
      sub: 'Management',
      color: C.warning,
      lightColor: C.warningLight,
      target: 'admin-dashboard',
    },
  ];

  return (
    <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',background:C.bg}}>
      {/* タイル */}
      <div style={{display:'flex',gap:20,flexWrap:'wrap',justifyContent:'center',width:'100%',maxWidth:1180}}>
        {tiles.map(t => (
          <div key={t.id}
            onClick={() => t.target && setScreen(t.target)}
            style={{flex:'1 1 240px',maxWidth:280,background:'#fff',borderRadius:8,padding:'36px 24px 28px',
              position:'relative',
              cursor: t.target ? 'pointer' : 'default',
              boxShadow:'0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.06)',
              border:`1px solid ${C.border}`,
              display:'flex',flexDirection:'column',alignItems:'center',textAlign:'center',
              transition:'transform 0.2s,box-shadow 0.2s,border-color 0.2s',userSelect:'none'}}
            onMouseEnter={e => {
              e.currentTarget.style.transform='translateY(-3px)';
              e.currentTarget.style.boxShadow=`0 10px 30px rgba(15,23,42,0.10)`;
              e.currentTarget.style.borderColor=t.color;
            }}
            onMouseLeave={e => {
              e.currentTarget.style.transform='translateY(0)';
              e.currentTarget.style.boxShadow='0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.06)';
              e.currentTarget.style.borderColor=C.border;
            }}>
            {t.badge && (
              <span style={{position:'absolute',top:12,right:12,fontSize:10,fontWeight:700,letterSpacing:0.5,
                padding:'2px 8px',borderRadius:4,background:t.lightColor,color:t.color}}>{t.badge}</span>
            )}
            {/* アイコン */}
            <div style={{width:72,height:72,borderRadius:8,background:t.lightColor,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20}}>
              <Icon name={t.icon} size={34} color={t.color} strokeWidth={1.5}/>
            </div>
            <div style={{fontSize:11,fontWeight:600,color:C.textLight,letterSpacing:1.5,marginBottom:6,textTransform:'uppercase'}}>{t.sub}</div>
            <div style={{fontSize:24,fontWeight:700,color:C.text,marginBottom:20}}>{t.label}</div>
            {/* 矢印ボタン */}
            <div style={{width:44,height:44,borderRadius:'50%',background:t.color,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>
              <Icon name="arrowRight" size={20} color="#fff" strokeWidth={2}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── PAGE TITLES ─── */
const PAGE_TITLES = {
  'home':'OnePrice',
  'buyer-list':'査定 / 車両一覧',
  'buyer-detail':'車両詳細',
  'tx-list':'取引中（購入）',
  'tx-detail':'取引詳細',
  'notifications':'通知一覧',
  'mypage':'マイページ',
  'seller-list':'出品',
  'seller-detail':'車両詳細（出品）',
  'unlisted-list':'購入',
  'direct-detail':'車両詳細',
  'price-negotiation':'価格交渉',
  'admin-dashboard':'管理ボード',
  'admin-regional':'地域別価格分析',
  'appraisal-dashboard':'査定',
};


/* ─── APP ROOT ─── */
function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [role, setRole] = useState('user');
  const [screen, setScreen] = useState('home');
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [selectedDirect, setSelectedDirect] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const handleLogin = r => {
    setRole(r);
    setScreen(r==='admin'?'admin-dashboard':'home');
    setLoggedIn(true);
  };

  if(!loggedIn) return <LoginScreen onLogin={handleLogin}/>;

  const renderScreen = () => {
    switch(screen) {
      case 'home': return <HomeScreen setScreen={setScreen}/>;
      case 'appraisal-dashboard': return <AppraisalDashboard setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'buyer-list': return <BuyerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'buyer-detail': return <BuyerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'tx-list': return <TxList setScreen={setScreen}/>;
      case 'tx-detail': return <TxDetail setScreen={setScreen}/>;
      case 'notifications': return <Notifications/>;
      case 'mypage': return <MyPage/>;
      case 'seller-list': return <SellerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'seller-detail': return <SellerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'unlisted-list': return <UnlistedList setScreen={setScreen} setSelectedDirect={setSelectedDirect}/>;
      case 'direct-detail': return <DirectDetailScreen vehicle={selectedDirect} setScreen={setScreen}/>;
      case 'price-negotiation': return <PriceNegotiation vehicle={selectedDirect} setScreen={setScreen}/>;
      case 'admin-dashboard': return <AdminDashboard setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'admin-regional': return <AdminRegional/>;
      default: return <HomeScreen setScreen={setScreen}/>;
    }
  };

  const title = screen === 'home' ? '' : (PAGE_TITLES[screen] || 'OnePrice');
  const purchaseScreens = ['unlisted-list','direct-detail','price-negotiation'];
  const accentColor = purchaseScreens.includes(screen) ? C.blue : C.red;

  return (
    <div style={{minHeight:'100vh',background:C.bg}}>
      <Sidebar role={role} screen={screen} setScreen={setScreen} setRole={setRole}
        open={sidebarOpen} onClose={() => setSidebarOpen(false)}/>
      <TopBar title={title} setScreen={setScreen} role={role} onMenuClick={() => setSidebarOpen(true)} accentColor={accentColor}/>
      <div style={{overflowY:'auto',overflowX:'hidden'}}>
        {renderScreen()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
