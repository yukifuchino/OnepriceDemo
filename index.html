window.__cdnFail = window.__cdnFail || [];

function __showErr(msg) {
  var d = document.getElementById('__errbox');
  if (!d) {
    d = document.createElement('div'); d.id = '__errbox';
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee2e2;color:#7f1d1d;padding:14px 18px;font:13px/1.6 monospace;white-space:pre-wrap;border-bottom:3px solid #ef4444;max-height:50vh;overflow:auto';
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent += msg + '\n';
}

/* JSエラーをキャッチ */
window.onerror = function(msg, src, line) {
  __showErr('❌ JS Error: ' + msg + '\n   → ' + (src||'').replace(/^.*\//, '') + ':' + line);
  return false;
};
window.onunhandledrejection = function(e) {
  __showErr('❌ Promise Error: ' + e.reason);
};

/* Babelのエラーは console.error 経由 → それもキャッチ */
(function() {
  var _origErr = console.error.bind(console);
  console.error = function() {
    _origErr.apply(console, arguments);
    var msg = Array.from(arguments).map(String).join(' ');
    if (/babel|transform|parse|syntax|unexpected token/i.test(msg)) {
      __showErr('❌ Babel Error: ' + msg.substring(0, 300));
    }
  };
})();

/* CDNロード失敗・マウント確認 */
document.addEventListener('DOMContentLoaded', function() {
  var msgs = [];
  if (typeof React === 'undefined')    msgs.push('React が読み込めませんでした');
  if (typeof ReactDOM === 'undefined') msgs.push('ReactDOM が読み込めませんでした');
  if (typeof Babel === 'undefined')    msgs.push('Babel が読み込めませんでした');
  if (msgs.length > 0) {
    __showErr('⚠️ CDN スクリプト読み込み失敗\n' + msgs.map(m=>'   • '+m).join('\n') +
      '\n\n→ start.command をダブルクリックして起動してください');
    return;
  }
  /* 10秒後に root が空なら診断情報を表示 */
  setTimeout(function() {
    var root = document.getElementById('root');
    if (root && (root.children.length === 0 || root.innerHTML.indexOf('__spin') >= 0)) {

        '→ DevTools Console (F12) でエラー内容を確認してください\n' +
        '→ または start.command をダブルクリックして起動してください');
    }
  }, 10000);
});

const fmt = n => '¥'+n.toLocaleString();

/* 集計金額を日本語の単位で丸める。桁を数えずに大きさが掴めるようにする
   例: 245,510,000 → 2億4,551万 ／ 9,030,000 → 903万 ／ 780,000 → 78万 */
const fmtJP = (n, opt = {}) => {
  const {sign = false} = opt;
  const s = n < 0 ? '−' : (sign && n > 0 ? '+' : '');
  const a = Math.abs(n);
  if (a === 0) return s + '0円';
  const oku = Math.floor(a / 100000000);
  const man = Math.round((a - oku * 100000000) / 10000);
  if (oku > 0) return s + oku + '億' + (man > 0 ? man.toLocaleString() + '万' : '');
  if (man > 0) return s + man.toLocaleString() + '万';
  return s + a.toLocaleString() + '円';
};

/* ─── WIKI IMAGE ─── */
function WikiImage({wikiImg, fallback, style}) {
  return (
    <img
      src={wikiImg || fallback || ''}
      alt=""
      style={style}
      onError={e => {
        if (fallback && e.target.src !== fallback) e.target.src = fallback;
      }}
    />
  );
}

/* ─── PHOTO THUMB (存在しない画像を自動非表示) ─── */
function PhotoThumb({src, fallback, style, onClick, thumbStyle}) {
  const [visible, setVisible] = React.useState(true);
  if (!visible) return null;
  return (
    <div onClick={onClick} style={thumbStyle}>
      <img src={src} alt="" style={style}
        onError={e => {
          if (fallback && e.target.src !== fallback) { e.target.src = fallback; }
          else setVisible(false);
        }}/>
    </div>
  );
}

/* ─── useVehiclePhotos: photosDir から自動で配列生成 ─── */
function useVehiclePhotos(v, max=12) {
  if (v.photos && v.photos.length) return v.photos;
  if (v.photosDir) return Array.from({length: max}, (_, i) => `${v.photosDir}/${i+1}.jpg`);
  const one = v.wikiImg || v.img;
  return one ? [one] : [];
}

    const el = ref.current;
    if (!el) return;
    // 即座に幅0にしてトランジションを無効化
    el.style.transition = 'none';
    el.style.width = '0%';
    // ダブルrAFでブラウザに0%を描画させてからアニメーション開始
    const raf1 = requestAnimationFrame(() => {
      const raf2 = requestAnimationFrame(() => {
        el.style.transition = `width 0.5s cubic-bezier(0.4,0,0.2,1) ${delay}ms, background 0.2s`;
        el.style.width = targetWidth;
      });
      return () => cancelAnimationFrame(raf2);
    });
    return () => cancelAnimationFrame(raf1);
  }, [targetWidth]);

  return (
    <div ref={ref} style={{
      height:'100%', width:'0%',
      background: color,
      borderRadius:4,
      display:'flex', alignItems:'center', paddingLeft:8,
      transition:'background 0.2s',
      overflow:'hidden', whiteSpace:'nowrap',
    }}>
      {children}
    </div>
  );
}

/* ─── VEHICLE REGIONAL PRICE CARD ─── */
function VehicleRegionalPrice({vehicle}) {
  const v = vehicle || VEHICLES[0];
  const [period, setPeriod] = useState('6ヶ月');
  const [priceMode, setPriceMode] = useState('market');
  const [hoveredCell, setHoveredCell] = useState(null);
  const [selectedRegion, setSelectedRegion] = useState(null);

  const mults = priceMode === 'auction' ? AUCTION_MULTS[period] : PERIOD_MULTS[period];
  const basePrice = v.marketPrice || v.price;
  const dealCounts = PERIOD_DEALS[period];

  // 列定義（地域 or 県別モード）
  let colNames, colPrices, colDeals;
  if (selectedRegion) {
    const ri = REGION_NAMES.indexOf(selectedRegion);
    const prefs = REGION_PREFECTURES[selectedRegion];
    const regionBasePrice = Math.round(basePrice * mults[ri]);
    const regionBaseDeals = dealCounts[ri];
    const sumMults = prefs.reduce((s, p) => s + p.mult, 0);
    colNames  = prefs.map(p => p.name);
    colPrices = prefs.map(p => Math.round(regionBasePrice * p.mult));
    colDeals  = prefs.map(p => Math.max(0, Math.round(regionBaseDeals * p.mult / sumMults)));
  } else {
    colNames  = REGION_NAMES;
    colPrices = REGION_NAMES.map((_, i) => Math.round(basePrice * mults[i]));
    colDeals  = dealCounts;
  }

  // 50万刻み・10行固定
  const BUCKET = 500000;
  const ROWS   = 7;
  const avgP   = colPrices.reduce((s, p) => s + p, 0) / colPrices.length;
  const midP   = Math.round(avgP / BUCKET) * BUCKET;
  const bEnd   = midP + Math.ceil(ROWS / 2) * BUCKET;
  const bStart = bEnd - ROWS * BUCKET;
  const buckets = [];
  for (let p = bEnd - BUCKET; p >= bStart; p -= BUCKET) buckets.push(p);

  const getCount = (bucketP, colP, total) => {
    const sigma = colP * (v.marketSpread || 0.065);
    const mid = bucketP + BUCKET / 2;
    const g = Math.exp(-0.5 * Math.pow((mid - colP) / sigma, 2));
    return Math.max(0, Math.round(total * g * 0.55));
  };

  const matrix = buckets.map(b => colPrices.map((cp, i) => getCount(b, cp, colDeals[i])));
  const maxVal = Math.max(1, ...matrix.flat());

  const cellColor = (val) => {
    if (!val) return { bg: 'transparent', color: 'transparent' };
    const t = val / maxVal;
    if (t >= 0.75) return { bg: '#D84315', color: '#fff' };
    if (t >= 0.55) return { bg: '#EF6C00', color: '#fff' };
    if (t >= 0.35) return { bg: '#FB8C00', color: '#fff' };
    if (t >= 0.18) return { bg: '#FFB300', color: '#5D3A00' };
    return { bg: '#FFE082', color: '#5D3A00' };
  };

  const fmtM = p => {
    const man = p / 10000;
    return man >= 100 ? Math.round(man) + '万円' : man.toFixed(man % 1 === 0 ? 0 : 1) + '万円';
  };

  return (
    <Card style={{padding:'16px 12px'}}>
      {/* ヘッダー */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}>
          {selectedRegion && (
            <button onClick={() => setSelectedRegion(null)}
              style={{background:'none',border:'none',color:C.blue,cursor:'pointer',fontSize:12,
                fontWeight:700,padding:0,display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
              ← 全地域
            </button>
          )}
          <div style={{fontWeight:700,fontSize:14,whiteSpace:'nowrap'}}>
            {selectedRegion ? `${selectedRegion}の県別相場` : '地域別価格分布'}
          </div>
        </div>
        <div style={{display:'flex',gap:2,background:'#F0F0F0',borderRadius:4,padding:3,flexShrink:0}}>
          {['1ヶ月','3ヶ月','6ヶ月','1年'].map(p => (
            <button key={p} onClick={() => setPeriod(p)}
              style={{padding:'3px 8px',borderRadius:4,fontSize:11,fontWeight:600,cursor:'pointer',border:'none',
                background:period===p?'#fff':'transparent',
                color:period===p?C.text:C.textMid,
                boxShadow:period===p?'0 1px 3px rgba(0,0,0,0.12)':'none'}}>
              {p}
            </button>
          ))}
        </div>
      </div>

      {/* 相場モード */}
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        {[['market','小売相場'],['auction','オークション相場']].map(([mode,label]) => (
          <button key={mode} onClick={() => setPriceMode(mode)}
            style={{padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:600,cursor:'pointer',
              border:`1.5px solid ${priceMode===mode?C.blue:C.border}`,
              background:priceMode===mode?C.blue:'#fff',
              color:priceMode===mode?'#fff':C.textMid}}>
            {label}
          </button>
        ))}
      </div>

      {/* ヒント（地域モード時のみ） */}
      {!selectedRegion && (
        <div style={{fontSize:10,color:C.textLight,marginBottom:8,display:'flex',alignItems:'center',gap:4}}>
          <span>💡</span>地域名をクリックすると県別に切り替えられます
        </div>
      )}

      {/* マトリクステーブル */}
      <div style={{overflowX:'auto',margin:'0 -4px'}}>
        <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
          <thead>
            <tr style={{borderBottom:`2px solid ${C.border}`}}>
              <th style={{width:76,padding:'7px 8px',textAlign:'left',fontSize:10,color:C.textMid,fontWeight:600}}>
                中古車の相場
              </th>
              {colNames.map((name) => (
                <th key={name}
                  onClick={!selectedRegion ? () => setSelectedRegion(name) : undefined}
                  style={{padding:'6px 2px',textAlign:'center',fontSize:12,fontWeight:700,
                    color:!selectedRegion?C.blue:C.text,
                    cursor:!selectedRegion?'pointer':'default',
                    userSelect:'none',transition:'opacity 0.15s'}}
                  onMouseEnter={e => { if(!selectedRegion) e.currentTarget.style.opacity='0.7'; }}
                  onMouseLeave={e => { e.currentTarget.style.opacity='1'; }}>
                  {name}
                  {!selectedRegion && (
                    <div style={{fontSize:8,color:C.textLight,fontWeight:400,marginTop:1}}>▼ 県別</div>
                  )}
                </th>
              ))}
            </tr>
            <tr style={{borderBottom:`1px solid ${C.border}`,background:'#F7F7F7'}}>
              <td style={{padding:'5px 8px',fontSize:10,color:C.textMid}}>
                合計 {colDeals.reduce((s,d)=>s+d,0)}件
              </td>
              {colDeals.map((d,i) => (
                <td key={i} style={{padding:'5px 2px',textAlign:'center',fontSize:11,color:C.textMid,fontWeight:600}}>
                  {d}件
                </td>
              ))}
            </tr>
          </thead>
          <tbody>
            {buckets.map((bucket, ri) => {
              const rowTotal = matrix[ri].reduce((s,vv)=>s+vv,0);
              const isTopBucket = ri === 0;
              return (
                <tr key={bucket} style={{borderBottom:`1px solid #F0F0F0`}}>
                  <td style={{padding:'2px 8px',whiteSpace:'nowrap',verticalAlign:'middle'}}>
                    <div style={{fontSize:11,color:C.text,fontWeight:500}}>
                      {isTopBucket ? fmtM(bucket)+'以上' : fmtM(bucket)+'−'}
                    </div>
                    {rowTotal > 0 && (
                      <div style={{fontSize:10,color:C.textMid}}>{rowTotal}件</div>
                    )}
                  </td>
                  {matrix[ri].map((val, ci) => {
                    const c = cellColor(val);
                    const isHov = hoveredCell && hoveredCell.r===ri && hoveredCell.c===ci;
                    return (
                      <td key={ci}
                        onMouseEnter={() => val>0 && setHoveredCell({r:ri,c:ci})}
                        onMouseLeave={() => setHoveredCell(null)}
                        style={{height:32,textAlign:'center',verticalAlign:'middle',
                          background:isHov?C.primary:c.bg,
                          color:isHov?'#fff':c.color,
                          fontWeight:700,fontSize:12,cursor:'default',
                          transition:'background 0.1s',
                          borderLeft:'1px solid #F5F5F5',
                          position:'relative'}}>
                        {val > 0 ? val : ''}
                        {isHov && (
                          <div style={{position:'absolute',bottom:'calc(100% + 4px)',left:'50%',
                            transform:'translateX(-50%)',
                            background:'#1A1A1A',color:'#fff',
                            padding:'4px 8px',borderRadius:4,fontSize:10,
                            whiteSpace:'nowrap',zIndex:100,pointerEvents:'none',
                            boxShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>
                            {colNames[ci]} {fmtM(bucket)}帯：{val}件
                            <div style={{position:'absolute',top:'100%',left:'50%',
                              transform:'translateX(-50%)',
                              borderLeft:'4px solid transparent',
                              borderRight:'4px solid transparent',
                              borderTop:'4px solid #1A1A1A'}}/>
                          </div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 凡例 */}
      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:10,paddingTop:8,borderTop:`1px solid ${C.borderLight}`}}>
        <span style={{fontSize:10,color:C.textMid,flexShrink:0}}>少ない</span>
        <div style={{display:'flex',gap:2,flex:1}}>
          {['#FFE082','#FFB300','#FB8C00','#EF6C00','#D84315'].map(c => (
            <div key={c} style={{flex:1,height:10,background:c,borderRadius:2}}/>
          ))}
        </div>
        <span style={{fontSize:10,color:C.textMid,flexShrink:0}}>多い</span>
        <span style={{fontSize:10,color:C.textLight,marginLeft:8,flexShrink:0}}>{period}集計</span>
      </div>
    </Card>
  );
}

/* ─── BUYER: 車両一覧 ─── */
function BuyerList({setScreen, setSelectedVehicle}) {
  const [searchVin, setSearchVin] = useState('');
  const [searchMaker, setSearchMaker] = useState('');
  const [searchAppraisalStatus, setSearchAppraisalStatus] = useState('');
  const [searchContractStatus, setSearchContractStatus] = useState('');
  const [filtered, setFiltered] = useState(VEHICLES);

  const doSearch = () => {
    setFiltered(VEHICLES.filter(v => {
      if(searchVin && !v.vin.includes(searchVin) && !v.name.includes(searchVin) && !v.appraisalNo.includes(searchVin)) return false;
      if(searchMaker && !v.maker.includes(searchMaker)) return false;
      if(searchAppraisalStatus && v.appraisalStatus !== searchAppraisalStatus) return false;
      if(searchContractStatus && v.contractStatus !== searchContractStatus) return false;
      return true;
    }));
  };

  const doClear = () => {
    setSearchVin(''); setSearchMaker(''); setSearchAppraisalStatus(''); setSearchContractStatus('');
    setFiltered(VEHICLES);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,padding:24}}>

                  <div style={{fontSize:14,color:C.text}}>{v.store}</div>
                  <div style={{fontSize:13,color:C.textMid}}>{v.assignee}</div>
                </td>
                <td style={{padding:'14px 14px'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:4}}>

/* ─── BUYER: 通知一覧 ─── */
function Notifications() {
  const [tab, setTab] = useState('all');
  const [notifs, setNotifs] = useState(NOTIFICATIONS);
  const tabs = [['all','すべて'],['unread','未読'],['bid','購入・交渉'],['system','システム']];
  const filtered = notifs.filter(n => {
    if(tab==='unread') return !n.read;
    if(tab==='bid') return n.type.includes('入札');
    if(tab==='system') return n.type==='システム';
    return true;
  });
  return (
    <div style={{padding:24,maxWidth:800}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',background:C.borderLight,borderRadius:4,padding:2,gap:1}}>
          {tabs.map(([v,l]) => (
            <button key={v} onClick={() => setTab(v)}
              style={{padding:'6px 14px',borderRadius:4,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
                background:tab===v?'#fff':'transparent',color:tab===v?C.red:C.textMid,
                boxShadow:tab===v?'0 1px 4px rgba(0,0,0,0.08)':'none'}}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={() => setNotifs(prev => prev.map(n => ({...n,read:true})))}
          style={{background:'none',border:`1px solid ${C.border}`,color:C.textMid,borderRadius:4,padding:'6px 14px',fontSize:12,cursor:'pointer'}}>
          すべて既読にする
        </button>
      </div>
      <Card p={0}>
        {filtered.length===0 && <div style={{padding:48,textAlign:'center',color:C.textLight}}>通知はありません</div>}
        {filtered.map((n,i) => (
          <div key={n.id} onClick={() => setNotifs(prev => prev.map(x => x.id===n.id?{...x,read:true}:x))}
            style={{display:'flex',gap:12,padding:'14px 16px',borderBottom:i<filtered.length-1?`1px solid ${C.borderLight}`:'none',
              borderLeft:`3px solid ${n.read?'transparent':C.red}`,cursor:'pointer',
              background:n.read?'#fff':'#FFFAFA',transition:'background 0.1s'}}
            onMouseEnter={e => e.currentTarget.style.background='#F9F9F9'}
            onMouseLeave={e => e.currentTarget.style.background=n.read?'#fff':'#FFFAFA'}>
            <div style={{width:8,height:8,borderRadius:'50%',background:n.read?'transparent':C.red,marginTop:7,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4,gap:12}}>
                <div style={{fontWeight:n.read?400:700,fontSize:13,color:C.text}}>{n.title}</div>
                <span style={{fontSize:11,color:C.textLight,whiteSpace:'nowrap'}}>{n.time}</span>
              </div>
              <div style={{fontSize:12,color:C.textMid,marginBottom:4}}>{n.body}</div>
              <Badge color={C.blue}>{n.type}</Badge>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

  const openNew = (v) => { setModalVehicle(v||null); setNewModal(true); };
  const handleList = (vehicleId) => { setListedIds(prev => [...prev, vehicleId]); setNewModal(false); };

  const filteredVehicles = VEHICLES.filter(v => {
    if (brandFilter && !v.maker.includes(brandFilter) && !v.name.includes(brandFilter)) return false;
    const isListed = listedIds.includes(v.id);
    if (stateFilter === 'listed'   && !isListed) return false;
    if (stateFilter === 'unlisted' &&  isListed) return false;
    if (stateFilter === 'nego' && v.contractStatus !== '交渉中') return false;
    return true;
  });

  const listedCount = listedIds.length;
  const negoCount = VEHICLES.filter(v => listedIds.includes(v.id) && v.contractStatus === '交渉中').length;
  const kpis = [
    {label:'出品中',     value:`${listedCount}件`, icon:'package', color:C.textMid},
    {label:'交渉中',     value:`${negoCount}件`,   icon:'message', color:C.warning},
    {label:'今月の成約', value:'9件',              icon:'checkCircle', color:C.success},
    {label:'今月の売上', value:'6,840万円',        icon:'jpy', color:C.primary, highlight:true},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>
      {/* KPI */}
      <div style={{background:'#fff',borderRadius:10,border:`1px solid ${C.border}`,boxShadow:'0 1px 4px rgba(0,0,0,0.06)',overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)'}}>
          {kpis.map((k,i,arr) => (
            <div key={k.label} style={{padding:'14px 16px',borderRight:i<arr.length-1?`1px solid ${C.border}`:'none',display:'flex',flexDirection:'column',gap:6}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:11,color:C.textMid,fontWeight:500}}>{k.label}</div>
                <Icon name={k.icon} size={14} color={k.color}/>
              </div>
              <div style={{fontSize:k.highlight?22:20,fontWeight:700,color:k.highlight?C.primary:C.text,letterSpacing:'-0.02em'}}>{k.value}</div>
            </div>
          ))}
        </div>
      </div>

      {/* フィルター */}
      <Card>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
          <Input label="ブランド / 車種" value={brandFilter} onChange={e=>setBrandFilter(e.target.value)} placeholder="例: BMW" style={{width:160}}/>
          <SelectField label="出品状況" value={stateFilter} onChange={e=>setStateFilter(e.target.value)}
            options={[{value:'',label:'すべて'},{value:'listed',label:'出品中'},{value:'unlisted',label:'未出品'},{value:'nego',label:'交渉中'}]} style={{width:140}}/>
          {(brandFilter||stateFilter) && (
            <Btn variant="ghost" onClick={()=>{setBrandFilter('');setStateFilter('');}}>クリア</Btn>
          )}
          <div style={{marginLeft:'auto'}}>
            <Btn color={C.primary} onClick={()=>openNew(null)}>＋ 新規出品</Btn>
          </div>
        </div>
      </Card>

      {/* 一覧 */}
      <Card p={0}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['','車両情報','出品状況','即決価格','査定価格','アクション'].map(h => (
                <th key={h} style={{padding:'12px 14px',textAlign:'left',fontSize:14,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filteredVehicles.map(v => {
              const isListed = listedIds.includes(v.id);
              const nego = isListed && v.contractStatus === '交渉中';
              return (
              <tr key={v.id} style={{borderBottom:`1px solid ${C.borderLight}`,background:isListed?'#fff':'#FAFAFA'}}
                onMouseEnter={e => e.currentTarget.style.background='#F5F5F5'}
                onMouseLeave={e => e.currentTarget.style.background=isListed?'#fff':'#FAFAFA'}>
                <td style={{padding:'16px 14px',width:150,position:'relative'}}>
                  <div style={{position:'relative',display:'inline-block'}}>
                    <WikiImage wikiImg={v.wikiImg} fallback={v.img} style={{width:126,height:88,borderRadius:4,objectFit:'cover',display:'block',background:'#2a2a2a',opacity:isListed?1:0.65}}/>
                    <span style={{position:'absolute',bottom:4,left:4,background:isListed?C.green:'#888',color:'#fff',fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:3}}>{isListed?'出品中':'未出品'}</span>
                  </div>
                </td>
                <td style={{padding:'16px 14px'}}>
                  <div
                    style={{fontWeight:700,fontSize:17,color:C.red,cursor:'pointer',display:'inline',transition:'opacity 0.15s'}}
                    onClick={() => { setSelectedVehicle(v); setScreen('seller-detail'); }}
                    onMouseEnter={e=>e.currentTarget.style.opacity='0.7'}
                    onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
                    {v.maker} {v.name}
                  </div>
                  <div style={{fontSize:14,color:C.textMid,marginTop:4}}>{v.grade} / {v.registration}</div>
                  <div style={{fontSize:14,color:C.textMid}}>{v.mileage.toLocaleString()}km</div>
                </td>
                <td style={{padding:'16px 14px'}}>
                  {isListed
                    ? (nego
                        ? <Badge color={C.warning}>交渉中</Badge>
                        : <Badge color={C.success}>掲載中</Badge>)
                    : <span style={{fontSize:14,color:C.textLight,background:'#eee',padding:'4px 10px',borderRadius:4}}>未出品</span>}
                </td>
                <td style={{padding:'16px 14px'}}>
                  {isListed
                    ? <div style={{fontSize:17,fontWeight:700,color:C.success}}>{fmt(v.price)}</div>
                    : <span style={{fontSize:14,color:C.textLight}}>—</span>}
                </td>
                <td style={{padding:'16px 14px',fontSize:16,fontWeight:600}}>{fmt(v.price+300000)}</td>
                <td style={{padding:'16px 14px'}}>
                  <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                    {isListed ? (
                      <>
                        <Btn variant="ghost" style={{height:38,fontSize:14}}>価格変更</Btn>
                        <Btn variant="ghost" style={{height:38,fontSize:14,color:C.danger,borderColor:C.danger}}
                          onClick={()=>setListedIds(prev=>prev.filter(id=>id!==v.id))}>取り下げ</Btn>
                      </>
                    ) : (
                      <Btn color={C.red} style={{height:38,fontSize:14}} onClick={() => openNew(v)}>出品する</Btn>
                    )}
                  </div>
                </td>
              </tr>
              );
            })}
            {filteredVehicles.length===0 && (
              <tr><td colSpan={6} style={{padding:'40px',textAlign:'center',color:C.textMid,fontSize:14}}>条件に一致する車両がありません</td></tr>
            )}
          </tbody>
        </table>
      </Card>

      {newModal && <SellerNewModal vehicle={modalVehicle} onClose={() => setNewModal(false)} onList={handleList}/>}
    </div>
  );
}

/* ─── SELLER: 新規出品モーダル ─── */
function SellerNewModal({vehicle, onClose, onList}) {
  const v = vehicle;
  const [saleType, setSaleType] = useState('auction');
  const [period, setPeriod] = useState('7');
  const [startPrice, setStartPrice] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const [done, setDone] = useState(false);
  const canSubmit = startPrice && Number(startPrice) > 0;
  const handleSubmit = () => {
    if (!canSubmit) return;
    setDone(true);
    setTimeout(() => { onList && onList(v.id); }, 1400);
  };
  const appraisalPrice = v ? v.price + 300000 : null;
  const handleAiPrice = () => {
    if (!appraisalPrice) return;
    setAiLoading(true);
    setTimeout(() => {
      const suggested = Math.round(appraisalPrice * 1.12 / 10000) * 10000;
      setStartPrice(String(suggested));
      setAiLoading(false);
    }, 900);
  };
  return (
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}
      onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      {/* 背景オーバーレイ */}
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(2px)'}}/>
      {/* モーダル本体 */}
      <div style={{position:'relative',background:'#fff',borderRadius:12,width:'100%',maxWidth:560,maxHeight:'88vh',overflowY:'auto',
        boxShadow:'0 24px 64px rgba(0,0,0,0.18)',display:'flex',flexDirection:'column'}}>
        {/* ヘッダー */}
        <div style={{padding:'20px 24px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          {v && <WikiImage wikiImg={v.wikiImg} fallback={v.img} style={{width:56,height:40,borderRadius:4,objectFit:'cover',background:'#2a2a2a'}}/>}
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:800}}>{v ? `${v.maker} ${v.name}` : '新規出品'}</div>
            {v && <div style={{fontSize:12,color:C.textMid}}>{v.grade} / {v.registration} / {v.mileage.toLocaleString()}km</div>}
          </div>
          <button onClick={onClose}
            style={{width:32,height:32,borderRadius:'50%',border:`1px solid ${C.border}`,background:'#fff',
              cursor:'pointer',fontSize:16,color:C.textMid,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>✕</button>
        </div>
        {/* コンテンツ */}
        <div style={{padding:'20px 24px',display:'flex',flexDirection:'column',gap:16,flex:1}}>
          {/* 出品形式 */}
          <div>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>出品形式</div>
            <div style={{padding:14,borderRadius:4,border:`1px solid ${C.primary}`,background:C.primaryLight,display:'flex',alignItems:'center',gap:12}}>
              <Icon name="clock" size={20} color={C.primary}/>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:C.primary,marginBottom:3}}>即決価格で掲載</div>
                <div style={{fontSize:11,color:C.textMid,lineHeight:1.5}}>提示した価格で購入申請を受け付けます。価格交渉も可能です</div>
              </div>
            </div>
          </div>
          {/* 査定金額 + AI価格設定 */}
          {appraisalPrice && (
            <div style={{background:'#F0F7FF',borderRadius:8,padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <div>
                <div style={{fontSize:11,color:C.textMid,marginBottom:2}}>査定金額</div>
                <div style={{fontSize:20,fontWeight:800,color:C.red}}>{fmt(appraisalPrice)}</div>
              </div>
              <button onClick={handleAiPrice} disabled={aiLoading}
                style={{padding:'8px 16px',borderRadius:8,background: aiLoading ? '#ccc' : 'linear-gradient(135deg,#667eea,#764ba2)',
                  color:'#fff',border:'none',fontSize:12,fontWeight:700,cursor:aiLoading?'default':'pointer',
                  display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',flexShrink:0}}>
                <Icon name="sparkles" size={14} color="#fff"/>
                {aiLoading ? 'AI分析中...' : 'AIによる価格設定'}
              </button>
            </div>
          )}
          {/* 開始価格 */}
          <div>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>即決価格</div>
            <Input value={startPrice ? Number(startPrice).toLocaleString() : ''} onChange={e=>setStartPrice(e.target.value.replace(/,/g,''))} placeholder="例: 8500000"/>
          </div>
        </div>
        {/* フッター */}
        {done ? (
          <div style={{padding:'32px 24px',textAlign:'center',flexShrink:0,borderTop:`1px solid ${C.border}`,background:C.successLight,borderRadius:'0 0 8px 8px'}}>
            <div style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:48,height:48,borderRadius:'50%',background:C.success,marginBottom:10}}>
              <Icon name="check" size={26} color="#fff" strokeWidth={2.5}/>

/* ─── 管理ボード：会社全体の歩留まりを段階で見る ───
   利用者：ディーラー会社の本部・経営層

/* 要約カード（クリックで該当案件） */
function StatCard({label, value, unit, color, sub, onClick, delta, deltaUnit, lowerIsBetter}) {
  const [hov, setHov] = useState(false);
  /* delta: 前期との差。lowerIsBetter のときは減った方が良い指標として色を反転する */
  const good = delta == null ? null : (lowerIsBetter ? delta < 0 : delta > 0);
  const flat = delta === 0;
  return (
    <div onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:'#fff',borderRadius:8,border:`1px solid ${hov?color:C.border}`,padding:16,
        cursor:onClick?'pointer':'default',position:'relative',transition:'border-color 0.15s,box-shadow 0.15s',
        boxShadow:hov?`0 4px 14px ${color}22`:'none'}}>
      <div style={{fontSize:11,color:C.textMid,fontWeight:600,marginBottom:8}}>{label}</div>
      <div style={{display:'flex',alignItems:'baseline',gap:9}}>
        <span style={{fontSize:30,fontWeight:800,color,letterSpacing:'-0.02em'}}>
          {value}<span style={{fontSize:14,fontWeight:500,color:C.textMid}}>{unit}</span>
        </span>
        {delta != null && (
          <span style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',
            color: flat ? C.textLight : (good ? C.success : C.danger)}}>
            {flat ? '±0' : `${delta>0?'▲':'▼'}${Math.abs(delta)}`}{flat?'':deltaUnit}
            <span style={{fontSize:10,fontWeight:500,color:C.textLight,marginLeft:3}}>前期比</span>
          </span>
        )}
      </div>
      <div style={{fontSize:11,color:C.textLight,marginTop:6}}>{sub}</div>
      {onClick && (
        <span style={{position:'absolute',top:14,right:14,fontSize:10,color:hov?color:C.textLight,
          fontWeight:600,transition:'color 0.15s'}}>該当を見る ›</span>
      )}
    </div>
  );
}

/* 円グラフ（ドーナツ）：順序のないカテゴリの構成比を見せる。
   工程順のデータには使わない（並べ替えの慣例と衝突するため） */
/* 工程順の横棒：母数を1つの状態に排他分割して見せる。
   順序のあるデータなので並べ替えず、工程どおりに上から並べる */
function StageBars({total, segments, scaleByTotal, showZero, compact}) {
  const [hov, setHov] = useState(null);
  const shown = showZero ? segments : segments.filter(s => s.count > 0);
  /* scaleByTotal: 母数を基準に伸ばす。2つ並べて比較するときに使う */
  const max = scaleByTotal ? (total || 1) : Math.max(...shown.map(s => s.count), 1);

  return (
    <div>
      {shown.map((s,i) => {
        const on = hov === i;
        const pct = total ? Math.round(s.count / total * 100) : 0;
        const zero = s.count === 0;
        const clickable = !!s.onClick && !zero;
        return (
          <div key={s.label} onClick={clickable?s.onClick:undefined}
            onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
            style={{display:'flex',alignItems:'center',gap:compact?7:10,padding:compact?'5px 8px':'7px 8px',margin:'0 -8px',
              borderRadius:6,cursor:clickable?'pointer':'default',opacity:zero?0.5:1,
              background:on?s.color+'12':'transparent',transition:'background 0.15s'}}>
            {/* ラベル */}
            <div style={{width:compact?86:118,flexShrink:0,textAlign:'right'}}>
              <div style={{fontSize:compact?12:13,fontWeight:on?700:500}}>{s.label}</div>
            </div>
            {/* バー */}
            <div style={{flex:1,height:compact?20:24,background:C.borderLight,borderRadius:4,overflow:'hidden',minWidth:36}}>
              {!zero && (
                <div style={{height:'100%',width:`${Math.max(s.count/max*100,3)}%`,background:s.color,
                  borderRadius:4,transition:'width 0.3s'}}/>
              )}
            </div>
            {/* 数値 */}
            <div style={{width:compact?56:74,flexShrink:0,display:'flex',alignItems:'baseline',justifyContent:'flex-end',gap:5}}>
              <span style={{fontSize:compact?14:16,fontWeight:800,color:zero?C.textLight:s.color}}>{s.count}</span>
              <span style={{fontSize:11,color:C.textMid,minWidth:28,textAlign:'right'}}>{pct}%</span>
            </div>
          </div>
        );
      })}
      {/* 説明（ホバー中の行、なければ母数） */}
      <div style={{marginTop:10,minHeight:30,padding:'7px 10px',borderRadius:6,
        background:hov!=null?shown[hov].color+'10':C.bg,transition:'background 0.15s'}}>
        {hov != null ? (
          <span style={{fontSize:12,color:C.textMid}}>
            {shown[hov].desc}
            {shown[hov].onClick && (
              <span style={{color:shown[hov].color,fontWeight:600,marginLeft:8}}>クリックで該当を表示 ›</span>
            )}
          </span>
        ) : (
          <span style={{fontSize:12,color:C.textLight}}>合計 {total}件（各案件は1つの状態にのみ該当）</span>
        )}
      </div>
    </div>
  );
}

function AdminDashboard({setScreen, setSelectedVehicle}) {
  /* クリックで開くドリルダウン { title, sub, rows, kind } */
  const [drill, setDrill] = useState(null);
  const [period, setPeriod] = useState('月別');

  /* ── 集計期間 ──
     当期＝直近N日、前期＝その1つ前の同じ長さ。前期比の基準になる */
  const span = PERIOD_MAX_DAYS[period] || 9999;
  const daysAgo = v => (ELAPSED[v.id] || {}).daysAgo;
  const inCur   = v => { const d = daysAgo(v); return d != null && d <= span; };
  const inPrev  = v => { const d = daysAgo(v); return d != null && d > span && d <= span * 2; };

  const CUR  = ALL_DASH.filter(inCur);
  const PREV = ALL_DASH.filter(inPrev);

  /* ── 査定ファネル ──
     商談到達 = 商談中 + 結果が出たもの。内訳の合計が母数と必ず一致する */
  const isDone    = v => ['成約','不成約','返信なし'].includes(v.contractStatus);
  const isOngoing = v => !isDone(v) &&
    (v.contractStatus === '交渉中' || ['商談中','交渉済','下書き'].includes(v.appraisalStatus));

  const vAll      = CUR;
  const vWaiting  = CUR.filter(v => v.appraisalStatus === '査定待ち');
  const vDone     = CUR.filter(v => v.appraisalStatus !== '査定待ち');
  const vWon      = CUR.filter(v => v.contractStatus === '成約');
  const vLost     = CUR.filter(v => v.contractStatus === '不成約');
  const vNoReply  = CUR.filter(v => v.contractStatus === '返信なし');
  const vOngoing  = CUR.filter(isOngoing);
  const vReached  = [...vWon, ...vLost, ...vNoReply, ...vOngoing];
  const vStalled  = CUR.filter(v => (ELAPSED[v.id]||{}).level >= 2);
  const vLeak     = [...vNoReply, ...vLost];
  /* 査定依頼を1件ずつ排他の状態に振り分ける（合計＝母数） */
  const reachedIds = new Set(vReached.map(v => v.id));
  const vIdle     = vDone.filter(v => !reachedIds.has(v.id));  // 査定は済んだが商談未着手

  /* 前期の同じ指標（前期比の分母） */
  const pDone    = PREV.filter(v => v.appraisalStatus !== '査定待ち').length;
  const pWon     = PREV.filter(v => v.contractStatus === '成約').length;
  const pReached = PREV.filter(v => isDone(v) || isOngoing(v)).length;
  const pLeak    = PREV.filter(v => ['返信なし','不成約'].includes(v.contractStatus)).length;
  const pNegoRate = pDone ? Math.round(pReached / pDone * 100) : null;
  const pWinRate  = pReached ? Math.round(pWon / pReached * 100) : null;

  const total=vAll.length, waiting=vWaiting.length, done=vDone.length;
  const won=vWon.length, lost=vLost.length, noReply=vNoReply.length;
  const ongoing=vOngoing.length, reached=vReached.length, stalled=vStalled.length;

  /* ── 未入庫売買：売り ── */
  const vListed   = VEHICLES.filter(v => v.listed);
  const vReacted  = vListed.filter(v => v.bids > 0);
  /* 掲載中の車両を1台ずつ排他の状態に振り分ける（成約が最優先） */
  const vSellWonListed = vListed.filter(v => v.contractStatus === '成約');
  const vSellNego = vListed.filter(v => v.contractStatus === '交渉中');
  const vSellRest = vListed.filter(v => !['成約','交渉中'].includes(v.contractStatus));
  const vNoReact  = vSellRest.filter(v => !v.bids);   // 問合せゼロ
  const vWaitingBuyer = vSellRest.filter(v => v.bids > 0); // 反応はあるが交渉前
  const vSellWon  = VEHICLES.filter(v => v.contractStatus === '成約');
  const listed=vListed, reacted=vReacted.length, sellNego=vSellNego.length, sellWon=vSellWon.length;

  /* ── 未入庫売買：買い ── */
  const bApplied = MY_BIDS.filter(b => b.status === '申請中');
  const bNego    = MY_BIDS.filter(b => ['交渉中','回答待ち'].includes(b.status));
  const bWon     = MY_BIDS.filter(b => b.status === '購入確定');
  const bDrop    = MY_BIDS.filter(b => b.status === '見送り');
  const applied=bApplied.length, buyNego=bNego.length, buyWon=bWon.length, buyDrop=bDrop.length;
  const buyBase  = applied + buyNego + buyWon + buyDrop;

  const negoRate = done ? Math.round(reached / done * 100) : 0;
  const winRate  = reached ? Math.round(won / reached * 100) : 0;

  /* ── 金額のパイプライン ──
     件数ではなく金額で、いまどの段階にいくら乗っているかを見る */
  const sum = rows => rows.reduce((s,v) => s + (v.price || 0), 0);
  const pipe = [
    {label:'査定中',   rows:[...vWaiting, ...vIdle], color:'#94A3B8', desc:'まだ商談に入っていない'},
    {label:'商談中',   rows:vOngoing,                color:C.info,    desc:'結果待ち。ここが将来の売上'},
    {label:'返信なし', rows:vNoReply,                color:C.danger,  desc:'止まっている金額。再商談で戻せる可能性がある'},
    {label:'成約',     rows:vWon,                    color:C.success, desc:'確定した金額'},
  ].map(p => ({...p, amount: sum(p.rows)}));
  const pipeTotal = pipe.reduce((s,p) => s + p.amount, 0);
  const prevWonAmt = sum(PREV.filter(v => v.contractStatus === '成約'));
  const wonAmt = sum(vWon);

  /* ── 出口から見た採算 ──
     出口は2つ。小売（カーセンサー相場）と AA（オークション相場）。
     どちらに出すかで採算が変わるため、両方を並べて比較する */
  const vPriced = CUR.filter(v => v.price > 0 && v.retailPrice > 0 && v.auctionPrice > 0);
  const gpRetail  = v => v.retailPrice  - v.price;
  const gpAuction = v => v.auctionPrice - v.price;
  const rRetail   = v => v.retailPrice  ? gpRetail(v)  / v.retailPrice  : 0;
  const rAuction  = v => v.auctionPrice ? gpAuction(v) / v.auctionPrice : 0;

  const buyTotal     = vPriced.reduce((s,v) => s + v.price, 0);
  const retailTotal  = vPriced.reduce((s,v) => s + v.retailPrice, 0);
  const auctionTotal = vPriced.reduce((s,v) => s + v.auctionPrice, 0);
  const retailGross  = retailTotal  - buyTotal;
  const auctionGross = auctionTotal - buyTotal;
  const retailRate   = retailTotal  ? Math.round(retailGross  / retailTotal  * 100) : 0;
  const auctionRate  = auctionTotal ? Math.round(auctionGross / auctionTotal * 100) : 0;

  /* 出口の選択で3つに排他分割 */
  const vBothOk   = vPriced.filter(v => gpRetail(v) > 0 && gpAuction(v) > 0);  // どちらでも黒字
  const vRetailOk = vPriced.filter(v => gpRetail(v) > 0 && gpAuction(v) <= 0); // 小売なら黒字・AAだと赤字
  const vBothNg   = vPriced.filter(v => gpRetail(v) <= 0);                     // 小売でも赤字
  const vAucNg    = vPriced.filter(v => gpAuction(v) <= 0);                    // AAだと赤字（参考）

  /* 店舗別の出口採算（本部が「どの店に話すか」を決めるための粒度） */
  const exitStores = [...new Set(vPriced.map(v => v.store))];
  const storeExit = exitStores.map(st => {
    const rows = vPriced.filter(v => v.store === st);
    const b  = rows.reduce((s,v) => s + v.price, 0);
    const rt = rows.reduce((s,v) => s + v.retailPrice, 0);
    const at = rows.reduce((s,v) => s + v.auctionPrice, 0);
    return {
      store: st, rows,
      rRate: rt ? Math.round((rt-b)/rt*100) : 0,
      aRate: at ? Math.round((at-b)/at*100) : 0,
      ng: rows.filter(v => gpRetail(v) <= 0),   // 小売でも赤字＝本部が確認すべき案件
    };
  }).filter(s => s.rows.length > 0)
    .sort((a,b) => b.ng.length - a.ng.length || a.rRate - b.rRate);

  const openV = (title, sub, rows) => setDrill({title, sub, rows, kind:'vehicle'});
  const openB = (title, sub, rows) => setDrill({title, sub, rows, kind:'bid'});

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>

      {/* 集計期間 */}
      <Card>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <span style={{fontSize:12,color:C.textMid,fontWeight:600}}>集計期間</span>
          <div style={{display:'flex',background:'#F0F0F0',borderRadius:4,padding:3,gap:2}}>
            {['日別','週別','月別','年別'].map(t => (
              <button key={t} onClick={()=>setPeriod(t)}
                style={{padding:'5px 16px',borderRadius:4,fontSize:12,fontWeight:600,cursor:'pointer',border:'none',
                  background:period===t?'#fff':'transparent',
                  color:period===t?C.text:C.textMid,
                  boxShadow:period===t?'0 1px 3px rgba(0,0,0,0.12)':'none',transition:'all 0.15s'}}>
                {t}
              </button>
            ))}

// 地域ごとのスケール係数（全国=1.0）
const SOUBA_REGION_SCALE = {'全国':1.0,'関東':0.42,'関西':0.28,'東海':0.18,'九州':0.14};

function getSoubaMatrix(model, region) {
  const base = SOUBA_BASE[model];
  const scale = SOUBA_REGION_SCALE[region];
  return base.map(row => row.map(v => Math.max(0, Math.round(v * scale))));
}

function SoubaMatrix() {
  const [model, setModel] = useState('Audi A4');
  const [region, setRegion] = useState('全国');
  const matrix = getSoubaMatrix(model, region);
  const maxVal = Math.max(1, ...matrix.flat());
  const rowTotals = matrix.map(row => row.reduce((s,v) => s+v, 0));
  const totalCars = rowTotals.reduce((s,v) => s+v, 0);

  const getCellStyle = (val) => {
    if (val === 0) return {background:'transparent', color:'transparent'};
    const ratio = val / maxVal;
    const r = 255;
    const g = Math.round(243 - ratio * (243 - 101));
    const b = Math.round(224 - ratio * 224);
    return {
      background: `rgb(${r},${g},${b})`,

                const colTotal = matrix.reduce((s,row) => s+row[ci], 0);
                return (
                  <td key={ci} style={{padding:'6px 4px',textAlign:'center',fontSize:11,color:C.textMid,fontWeight:600,border:`1px solid ${C.borderLight}`}}>

                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </div>
    </Card>
  );
}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 20px'}}>

                ['ボディカラー',v.color],['修復歴',v.repairHistory],

            <div style={{fontSize:13,color:C.textMid,marginBottom:16}}>{v.grade}</div>

            <div style={{background:C.success+'10',border:`1px solid ${C.success}40`,borderRadius:8,padding:'16px',textAlign:'center',marginBottom:16}}>
              <div style={{fontSize:11,color:C.textMid,marginBottom:4}}>即決価格</div>
              <div style={{fontSize:34,fontWeight:900,color:C.success}}>{fmt(v.buyNowPrice)}</div>
              <div style={{fontSize:11,color:C.textLight,marginTop:3}}>（税込）</div>

                <div style={{fontSize:11,color:C.info,fontWeight:700,marginBottom:6}}>⚡ AI相場予測</div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:C.textMid}}>

            <div style={{marginBottom:14}}>
              {ordered ? (
                <div style={{background:C.success+'18',border:`1px solid ${C.success}`,borderRadius:8,padding:'12px',textAlign:'center'}}>
                  <div style={{fontSize:14,fontWeight:700,color:C.success}}>✅ 購入申請済み</div>

                  <div style={{fontSize:14,fontWeight:700,color:C.warning}}>{existOrder.status}</div>
                  <div style={{fontSize:11,color:C.textMid,marginTop:4}}>申請日: {existOrder.requestTime}</div>
                </div>
              ) : (
                <button disabled={!v.available} onClick={()=>setShowModal(true)}
                  style={{width:'100%',height:48,background:v.available?C.success:'#ccc',color:'#fff',border:'none',
                    borderRadius:8,fontSize:15,fontWeight:700,cursor:v.available?'pointer':'not-allowed'}}>
                  {v.available?'この価格で購入を申請':'売約済み'}

              )}
            </div>

            <div style={{fontSize:11,color:C.textLight,textAlign:'center',marginBottom:16}}>

              <div style={{fontSize:11,color:C.textMid,marginBottom:4}}>担当</div>
              <div style={{fontSize:14,fontWeight:700}}>{v.assignee}</div>
              <div style={{fontSize:11,color:C.textMid}}>{v.store}</div>

          </Card>
        </div>
      </div>

      {showModal && (
        <BuyNowModal vehicle={v} onClose={()=>setShowModal(false)}
          onConfirm={()=>{setShowModal(false);setOrdered(true);}}/>
      )}
    </div>
  );
}

function UnlistedList({setScreen, setSelectedDirect}) {
  const [search, setSearch] = useState('');
  const [onlyAvail, setOnlyAvail] = useState(false);

  const avail = DIRECT_VEHICLES.filter(v => v.available).length;
  const pending = MY_DIRECT_ORDERS.filter(o => o.status === '審査中').length;
  const negotiating = MY_DIRECT_ORDERS.filter(o => o.status === '交渉中').length;
  const kpis = [
    {label:'掲載車両', value:`${DIRECT_VEHICLES.length}件`, icon:'package', color:C.textMid},
    {label:'購入可能', value:`${avail}件`,   icon:'checkCircle', color:C.success},
    {label:'交渉中',   value:`${negotiating}件`, icon:'message', color:C.warning},
    {label:'申請中',   value:`${pending}件`, icon:'clock', color:C.info, highlight:true},
  ];

  const list = DIRECT_VEHICLES.filter(v =>
    (!search || (v.maker+v.name+v.grade).includes(search)) &&
    (!onlyAvail || v.available)
  );

  const open = v => { setSelectedDirect(v); setScreen('direct-detail'); };

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>
      {/* KPI */}
      <div style={{background:'#fff',borderRadius:10,border:`1px solid ${C.border}`,boxShadow:'0 1px 4px rgba(0,0,0,0.06)',overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)'}}>
          {kpis.map((k,i,arr) => (
            <div key={k.label} style={{padding:'14px 18px',borderRight:i<arr.length-1?`1px solid ${C.border}`:'none',display:'flex',flexDirection:'column',gap:6}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:11,color:C.textMid,fontWeight:500}}>{k.label}</div>
                <Icon name={k.icon} size={14} color={k.color}/>
              </div>
              <div style={{fontSize:k.highlight?22:20,fontWeight:700,color:k.highlight?C.blue:C.text,letterSpacing:'-0.02em'}}>{k.value}</div>
            </div>
          ))}
        </div>
      </div>

      {/* 検索 */}
      <Card>
        <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{position:'relative',flex:1,minWidth:180}}>
            <Icon name="search" size={14} color={C.textLight} style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}/>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="メーカー・車種・グレードで検索"
              style={{width:'100%',height:36,border:`1px solid ${C.border}`,borderRadius:6,paddingLeft:30,paddingRight:10,fontSize:13,outline:'none',boxSizing:'border-box'}}/>
          </div>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:C.textMid,cursor:'pointer',whiteSpace:'nowrap'}}>
            <input type="checkbox" checked={onlyAvail} onChange={e=>setOnlyAvail(e.target.checked)} style={{cursor:'pointer'}}/>
            購入可能のみ
          </label>
          {(search||onlyAvail) && <Btn variant="ghost" onClick={()=>{setSearch('');setOnlyAvail(false);}}>クリア</Btn>}
        </div>
      </Card>

      {/* 車両カード */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
        {list.map(v => {
          const order = MY_DIRECT_ORDERS.find(o => o.vehicleId === v.id);
          const statusColor = DIRECT_ORDER_STATUS_COLOR[order && order.status] || null;
          return (
            <div key={v.id} onClick={()=>open(v)}
              style={{background:'#fff',borderRadius:10,boxShadow:'0 1px 4px rgba(0,0,0,0.08)',
                border:`1px solid ${C.border}`,cursor:'pointer',overflow:'hidden',
                opacity:v.available?1:0.7,transition:'box-shadow 0.15s,transform 0.15s'}}
              onMouseEnter={e=>{if(v.available){e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.12)';e.currentTarget.style.transform='translateY(-2px)';}}}
              onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 1px 4px rgba(0,0,0,0.08)';e.currentTarget.style.transform='none';}}>
              <div style={{height:155,background:'#f1f5f9',position:'relative',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <WikiImage wikiImg={v.wikiImg} fallback={v.img} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                <div style={{position:'absolute',top:8,left:8}}>
                  <TotalScoreBadge score={v.totalScore}/>

                  <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{color:'#fff',fontSize:14,fontWeight:700,background:'rgba(0,0,0,0.4)',padding:'4px 12px',borderRadius:4}}>売約済み</span>

                <div style={{fontSize:11,color:C.textMid,marginBottom:12}}>{v.grade} · {v.registration} · {v.mileage.toLocaleString()}km</div>
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:10,color:C.textMid,marginBottom:2}}>即決価格</div>
                  <div style={{fontSize:20,fontWeight:800,color:C.success}}>{fmt(v.buyNowPrice)}</div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button disabled={!v.available}
                    onClick={e=>{e.stopPropagation();open(v);}}
                    style={{flex:1,background:v.available?C.success:'#aaa',color:'#fff',border:'none',borderRadius:6,
                      padding:'8px 10px',fontSize:13,fontWeight:600,cursor:v.available?'pointer':'not-allowed'}}>
                    {v.available?'この価格で購入':'売約済み'}
                  </button>
                  {v.available && (
                    <button onClick={e=>{e.stopPropagation();setSelectedDirect(v);setScreen('price-negotiation');}}
                      style={{background:'#fff',color:C.primary,border:`1px solid ${C.primary}`,borderRadius:6,
                        padding:'8px 12px',fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                      価格交渉
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
        {list.length===0 && (
          <div style={{gridColumn:'1/-1',padding:'50px',textAlign:'center',color:C.textMid,background:'#fff',borderRadius:10,border:`1px solid ${C.border}`}}>
            条件に一致する車両がありません
          </div>
        )}
      </div>
    </div>
  );
}


/* ─── 価格交渉 ─── */
function PriceNegotiation({vehicle, setScreen}) {
  const v = vehicle || DIRECT_VEHICLES[0];
  const ask = v.buyNowPrice || v.price || 0;
  const [offer, setOffer] = useState(String(Math.round(ask * 0.95 / 100000) * 100000));
  const [note, setNote] = useState('');
  const [sent, setSent] = useState(false);

  const offerNum = Number(offer) || 0;
  const gap = ask - offerNum;
  const gapPct = ask ? (gap / ask * 100) : 0;
  const tooLow = gapPct > 15;

  /* 交渉履歴（相手とのやり取り） */
  const thread = [
    {who:'seller', name:v.seller||'MID 札幌東', date:'2026-07-24 10:12', price:ask,  text:'即決価格でご案内しています。'},
    {who:'buyer',  name:'自社',                date:'2026-07-25 15:40', price:Math.round(ask*0.93), text:'予算の都合上、この金額でご検討いただけないでしょうか。'},
    {who:'seller', name:v.seller||'MID 札幌東', date:'2026-07-26 09:05', price:Math.round(ask*0.97), text:'この金額までであれば対応可能です。'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>
      <button onClick={() => setScreen('unlisted-list')}
        style={{background:'none',border:'none',color:C.primary,cursor:'pointer',fontSize:13,padding:0,fontWeight:600,alignSelf:'flex-start'}}>
        ‹ 一覧に戻る
      </button>

      <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:16,alignItems:'start'}}>
        {/* 左：車両＋履歴 */}
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <Card>
            <div style={{display:'flex',gap:16}}>
              <WikiImage wikiImg={v.wikiImg} fallback={v.img}
                style={{width:150,height:104,borderRadius:6,objectFit:'cover',background:'#2a2a2a',flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:18,fontWeight:800}}>{v.maker} {v.name}</div>
                <div style={{fontSize:13,color:C.textMid,marginTop:3}}>
                  {v.grade} · {v.registration} · {(v.mileage||0).toLocaleString()}km
                </div>
                <div style={{marginTop:12,display:'flex',gap:24}}>
                  <div>
                    <div style={{fontSize:11,color:C.textMid}}>即決価格</div>
                    <div style={{fontSize:20,fontWeight:800,color:C.success}}>{fmt(ask)}</div>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:C.textMid}}>出品元</div>
                    <div style={{fontSize:14,fontWeight:600,marginTop:3}}>{v.seller||'MID 札幌東'}</div>
                  </div>
                </div>
              </div>
            </div>
          </Card>

          <Card>
            <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>交渉履歴</div>
            {thread.map((m,i) => {
              const mine = m.who === 'buyer';
              return (
                <div key={i} style={{display:'flex',justifyContent:mine?'flex-end':'flex-start',marginBottom:12}}>
                  <div style={{maxWidth:'78%'}}>
                    <div style={{fontSize:11,color:C.textLight,marginBottom:3,textAlign:mine?'right':'left'}}>
                      {m.name} · {m.date}
                    </div>
                    <div style={{background:mine?C.primaryLight:'#F5F6F8',
                      border:`1px solid ${mine?C.primary+'33':C.border}`,
                      borderRadius:8,padding:'10px 14px'}}>
                      <div style={{fontSize:16,fontWeight:800,color:mine?C.primary:C.text,marginBottom:4}}>{fmt(m.price)}</div>
                      <div style={{fontSize:13,color:C.textMid,lineHeight:1.6}}>{m.text}</div>
                    </div>
                  </div>
                </div>
              );
            })}
          </Card>
        </div>

        {/* 右：提示 */}
        <Card>
          {sent ? (
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{width:52,height:52,borderRadius:'50%',background:C.successLight,
                display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
                <Icon name="check" size={26} color={C.success}/>
              </div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>提示を送信しました</div>
              <div style={{fontSize:12,color:C.textMid,lineHeight:1.7}}>
                {fmt(offerNum)} で {v.seller||'出品元'} に打診しました。<br/>回答があると通知されます。
              </div>
              <div style={{marginTop:16}}>
                <Btn variant="ghost" onClick={()=>setScreen('unlisted-list')}>一覧に戻る</Btn>
              </div>
            </div>
          ) : (
            <>
              <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>金額を提示する</div>

              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,color:C.textMid,fontWeight:500,marginBottom:5}}>提示金額</div>
                <input value={offer} onChange={e=>setOffer(e.target.value.replace(/[^\d]/g,''))}
                  style={{width:'100%',height:44,border:`1px solid ${tooLow?C.danger:C.border}`,borderRadius:6,
                    padding:'0 12px',fontSize:19,fontWeight:700,outline:'none',boxSizing:'border-box',
                    color:tooLow?C.danger:C.text}}/>
                <div style={{fontSize:12,color:C.textMid,marginTop:6}}>
                  即決価格から <strong style={{color:gap>0?C.danger:C.success}}>
                    {gap>0?'▲':'+'}{Math.abs(gap/10000).toLocaleString()}万円
                  </strong>（{gapPct.toFixed(1)}%）
                </div>
                {tooLow && (
                  <div style={{marginTop:8,padding:'8px 10px',background:C.dangerLight,borderRadius:6,
                    fontSize:11,color:C.danger,lineHeight:1.6}}>
                    即決価格から15%以上低い提示です。成立しにくい可能性があります。
                  </div>
                )}
              </div>

              <div style={{display:'flex',gap:6,marginBottom:14}}>
                {[0.98,0.95,0.92].map(r => (
                  <button key={r} onClick={()=>setOffer(String(Math.round(ask*r/100000)*100000))}
                    style={{flex:1,height:30,border:`1px solid ${C.border}`,background:'#fff',borderRadius:5,
                      fontSize:11,color:C.textMid,cursor:'pointer'}}>
                    −{Math.round((1-r)*100)}%
                  </button>
                ))}
              </div>

              <div style={{marginBottom:14}}>
                <div style={{fontSize:12,color:C.textMid,fontWeight:500,marginBottom:5}}>メッセージ</div>
                <textarea value={note} onChange={e=>setNote(e.target.value)} rows={4}
                  placeholder="交渉の理由や条件を入力"
                  style={{width:'100%',border:`1px solid ${C.border}`,borderRadius:6,padding:'9px 11px',
                    fontSize:13,outline:'none',boxSizing:'border-box',resize:'vertical',fontFamily:'inherit'}}/>
              </div>

              <button onClick={()=>setSent(true)} disabled={!offerNum}
                style={{width:'100%',height:44,background:offerNum?C.primary:'#aaa',color:'#fff',border:'none',
                  borderRadius:6,fontSize:14,fontWeight:700,cursor:offerNum?'pointer':'not-allowed'}}>
                この金額で提示する
              </button>
              <div style={{fontSize:11,color:C.textLight,marginTop:10,lineHeight:1.6}}>
                提示は出品元に通知されます。合意後、入庫時の状態確認をもって成約となります。
              </div>
            </>
          )}
        </Card>
      </div>
    </div>
  );
}
