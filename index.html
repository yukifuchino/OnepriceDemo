/* ─── ANIMATED BAR ─── */
function AnimatedBar({targetWidth, color, delay=0, height=24, children}) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    // 即座に幅0にしてトランジションを無効化
    el.style.transition = 'none';
    el.style.width = '0%';
    // ダブルrAFでブラウザに0%を描画させてからアニメーション開始
    const raf1 = requestAnimationFrame(() => {
      const raf2 = requestAnimationFrame(() => {
        el.style.transition = `width 0.5s cubic-bezier(0.4,0,0.2,1) ${delay}ms, background 0.2s`;
        el.style.width = targetWidth;
      });
      return () => cancelAnimationFrame(raf2);
    });
    return () => cancelAnimationFrame(raf1);
  }, [targetWidth]);

  return (
    <div ref={ref} style={{
      height:'100%', width:'0%',
      background: color,
      borderRadius:4,
      display:'flex', alignItems:'center', paddingLeft:8,
      transition:'background 0.2s',
      overflow:'hidden', whiteSpace:'nowrap',
    }}>
      {children}
    </div>
  );
}

/* ─── VEHICLE REGIONAL PRICE CARD ─── */
function VehicleRegionalPrice({vehicle}) {
  const v = vehicle || VEHICLES[0];
  const [period, setPeriod] = useState('6ヶ月');
  const [selectedRegion, setSelectedRegion] = useState(null);

  const mults = PERIOD_MULTS[period];
  const dealCounts = PERIOD_DEALS[period];
  const regions = REGION_NAMES.map((name,i) => ({
    name, price: Math.round(v.price * mults[i]), deals: dealCounts[i],
  }));

  const maxPrice = Math.max(...regions.map(r => r.price));
  const minPrice = Math.min(...regions.map(r => r.price));
  const avgPrice = Math.round(regions.reduce((s,r) => s+r.price, 0) / regions.length);
  const topRegion = regions[0];
  const diff = topRegion.price - regions[regions.length-1].price;

  const handlePeriodChange = (p) => {
    if (p === period) return;
    setSelectedRegion(null);
    setPeriod(p);
  };

  return (
    <Card>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>地域別価格分析</div>
          <div style={{fontSize:11,color:C.textMid,marginTop:2}}>{v.maker} {v.name} の地域別成約価格</div>
        </div>
        {/* Period toggle */}
        <div style={{display:'flex',gap:2,background:'#F0F0F0',borderRadius:6,padding:3}}>
          {['1ヶ月','3ヶ月','6ヶ月','1年'].map(p => (
            <button key={p} onClick={() => handlePeriodChange(p)}
              style={{padding:'4px 10px',borderRadius:4,fontSize:11,fontWeight:600,cursor:'pointer',border:'none',
                background: period===p ? '#fff' : 'transparent',
                color: period===p ? C.text : C.textMid,
                boxShadow: period===p ? '0 1px 3px rgba(0,0,0,0.12)' : 'none',
                transition:'all 0.2s'}}>
              {p}
            </button>
          ))}
        </div>
      </div>

      {/* KPI cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:16}}>
        <div style={{background:'#FFF5F5',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:C.textMid,marginBottom:3}}>最高成約地域</div>
          <div style={{fontSize:14,fontWeight:800,color:C.red}}>{topRegion.name}</div>
          <div style={{fontSize:11,fontWeight:600,color:C.text}}>{fmt(topRegion.price)}</div>
        </div>
        <div style={{background:'#F8F8F8',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:C.textMid,marginBottom:3}}>全国平均</div>
          <div style={{fontSize:14,fontWeight:800}}>{fmt(avgPrice)}</div>
          <div style={{fontSize:11,color:C.textMid}}>{period}集計</div>
        </div>
        <div style={{background:'#F0FFF4',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:C.textMid,marginBottom:3}}>地域価格差</div>
          <div style={{fontSize:14,fontWeight:800,color:C.green}}>+{fmt(diff)}</div>
          <div style={{fontSize:11,color:C.textMid}}>最高−最低</div>
        </div>
      </div>

      {/* Bar chart — key={period} causes remount → AnimatedBar useLayoutEffect fires */}
      <div key={period} style={{display:'flex',flexDirection:'column',gap:7}}>
        {regions.map((r,i) => {
          const isSel = selectedRegion === r.name;
          const barW = `${(r.price - minPrice*0.9) / (maxPrice - minPrice*0.9) * 100}%`;
          return (
            <div key={r.name}>
              <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}
                onClick={() => setSelectedRegion(isSel ? null : r.name)}>
                <span style={{fontSize:12,width:40,flexShrink:0,textAlign:'right',
                  fontWeight:isSel?700:400,color:isSel?C.red:C.textMid,
                  transition:'color 0.2s'}}>{r.name}</span>
                <div style={{flex:1,background:C.borderLight,borderRadius:4,
                  height:isSel?30:24,overflow:'hidden',transition:'height 0.2s',
                  outline:isSel?`2px solid ${C.red}55`:'none'}}>
                  <AnimatedBar
                    targetWidth={barW}
                    color={isSel ? C.red : REGION_COLORS[i]}
                    delay={i * 60}
                  >
                    <span style={{fontSize:isSel?11:10,color:'#fff',fontWeight:700}}>
                      {fmt(r.price)}
                    </span>
                  </AnimatedBar>
                </div>
                <span style={{fontSize:10,width:28,textAlign:'right',flexShrink:0,
                  fontWeight:isSel?700:400,color:isSel?C.red:C.textLight,
                  transition:'color 0.2s'}}>{r.deals}件</span>
              </div>
              {isSel && (
                <div style={{marginLeft:50,marginTop:5,padding:'8px 12px',background:'#FFF5F5',
                  borderRadius:6,borderLeft:`3px solid ${C.red}`,fontSize:11,color:C.textMid,
                  animation:'fadeInDown 0.2s ease both'}}>
                  <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
                    <span>📍 {r.name}エリア</span>
                    <span>成約件数: <b style={{color:C.text}}>{r.deals}件</b></span>
                    <span>平均価格: <b style={{color:C.red}}>{fmt(r.price)}</b></span>
                    <span>全国比: <b style={{color:r.price>=avgPrice?C.green:C.orange}}>
                      {r.price>=avgPrice?'+':''}{fmt(r.price - avgPrice)}
                    </b></span>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginTop:12,paddingTop:12,borderTop:`1px solid ${C.borderLight}`}}>
        <span style={{fontSize:11,color:C.textMid}}>低価格</span>
        <div style={{flex:1,height:8,borderRadius:4,background:'linear-gradient(to right, #E9AAAF, #7B1D2B)'}}/>
        <span style={{fontSize:11,color:C.textMid}}>高価格</span>
        <span style={{fontSize:10,color:C.textLight,marginLeft:8}}>{period}集計・成約ベース</span>
      </div>
    </Card>
  );
}

  const [expanded, setExpanded] = useState({buy:true,sell:true,report:false,system:false,master:false,vehicle:false,tx:false,user:false});

  const NavItem = ({label, target, indent=false}) => {
    const active = screen === target;
    return (
      <div onClick={() => target && setScreen(target)}
        style={{display:'flex',alignItems:'center',gap:8,padding:`8px 12px 8px ${indent?28:12}px`,cursor:target?'pointer':'default',

          color:active?C.sidebarTextActive:C.sidebarText,fontSize:13,fontWeight:active?600:400}}

        onMouseLeave={e => { if(!active) e.currentTarget.style.background='transparent'; }}>
        <span style={{flex:1}}>{label}</span>
      </div>

  };

  const GroupItem = ({label, groupKey}) => (
    <div onClick={() => toggle(groupKey)}
      style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',cursor:'pointer',
        color:C.sidebarText,fontSize:13,borderRadius:6,marginBottom:1,fontWeight:500}}

      onMouseLeave={e => e.currentTarget.style.background='transparent'}>
      <span style={{flex:1}}>{label}</span>
      <span style={{fontSize:9,opacity:0.5}}>{expanded[groupKey]?'▲':'▼'}</span>
    </div>
  );

  const userNav = (<>

/* ─── BUYER: 車両一覧 ─── */
function BuyerList({setScreen, setSelectedVehicle}) {
  const [searchVin, setSearchVin] = useState('');
  const [searchMaker, setSearchMaker] = useState('');
  const [searchAppraisalStatus, setSearchAppraisalStatus] = useState('');
  const [searchContractStatus, setSearchContractStatus] = useState('');
  const [filtered, setFiltered] = useState(VEHICLES);

  const doSearch = () => {
    setFiltered(VEHICLES.filter(v => {
      if(searchVin && !v.vin.includes(searchVin) && !v.name.includes(searchVin) && !v.appraisalNo.includes(searchVin)) return false;
      if(searchMaker && !v.maker.includes(searchMaker)) return false;
      if(searchAppraisalStatus && v.appraisalStatus !== searchAppraisalStatus) return false;
      if(searchContractStatus && v.contractStatus !== searchContractStatus) return false;
      return true;
    }));
  };

  const doClear = () => {
    setSearchVin(''); setSearchMaker(''); setSearchAppraisalStatus(''); setSearchContractStatus('');
    setFiltered(VEHICLES);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,padding:24}}>
      {/* Search */}
      <Card>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
            <button style={{height:36,padding:'0 14px',background:'#fff',border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,cursor:'pointer',color:C.textMid,whiteSpace:'nowrap'}}>🏪 店舗選択</button>
            <Input label="メーカー" value={searchMaker} onChange={e=>setSearchMaker(e.target.value)} placeholder="例: BMW" style={{width:140}}/>
            <Input label="担当者" value="" onChange={()=>{}} placeholder="担当者名" style={{width:140}}/>
            <Input label="更新日" value="" onChange={()=>{}} type="date" style={{width:150}}/>
            <Input label="車台番号・車種名" value={searchVin} onChange={e=>setSearchVin(e.target.value)} placeholder="VINまたは車種名" style={{width:200}}/>
          </div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
            <SelectField label="査定ステータス" value={searchAppraisalStatus} onChange={e=>setSearchAppraisalStatus(e.target.value)}
              options={[{value:'',label:'すべて'},...Object.keys(APPRAISAL_STATUS_COLORS).map(k=>({value:k,label:k}))]} style={{width:150}}/>
            <SelectField label="契約結果ステータス" value={searchContractStatus} onChange={e=>setSearchContractStatus(e.target.value)}
              options={[{value:'',label:'すべて'},...Object.keys(CONTRACT_STATUS_COLORS).map(k=>({value:k,label:k}))]} style={{width:160}}/>
            <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
              <Btn onClick={doSearch}>検索</Btn>
              <Btn variant="ghost" onClick={doClear}>クリア</Btn>
            </div>
          </div>
        </div>
      </Card>

      {/* Table */}
      <Card p={0}>
        <div style={{padding:'10px 16px',background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:13,color:C.textMid}}>{filtered.length}件</span>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['査定番号 / ステータス','','メーカー / 車種名 / グレード','車体番号','初度登録','走行距離 / メーター','店舗 / 担当者','出品情報'].map((h,i) => (
                <th key={i} style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(v => (
              <tr key={v.id} style={{borderBottom:`1px solid ${C.borderLight}`,cursor:'pointer'}}
                onMouseEnter={e => e.currentTarget.style.background='#FAFAFA'}
                onMouseLeave={e => e.currentTarget.style.background='#fff'}
                onClick={() => { setSelectedVehicle(v); setScreen(v.type==='buynow'?'buyer-detail-buynow':'buyer-detail'); }}>
                <td style={{padding:'12px 14px',minWidth:130}}>
                  <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:5,fontFamily:'monospace'}}>{v.appraisalNo}</div>
                  <div style={{display:'flex',flexDirection:'column',gap:3}}>
                    <StatusBadge status={v.appraisalStatus} type="appraisal"/>
                    {v.contractStatus && <div style={{marginTop:2}}><StatusBadge status={v.contractStatus} type="contract"/></div>}
                  </div>
                </td>
                <td style={{padding:'12px 8px',width:92}}>
                  <img src={v.img} alt="" style={{width:80,height:56,borderRadius:4,objectFit:'cover',display:'block'}}/>
                </td>
                <td style={{padding:'12px 14px'}}>
                  <div style={{fontSize:11,color:C.textMid}}>{v.maker}</div>
                  <div style={{fontSize:14,fontWeight:700,color:C.text}}>{v.name}</div>
                  <div style={{fontSize:11,color:C.textMid}}>{v.grade}</div>
                </td>
                <td style={{padding:'12px 14px',fontSize:12,color:C.text,fontFamily:'monospace',whiteSpace:'nowrap'}}>{v.vin}</td>
                <td style={{padding:'12px 14px',fontSize:12,color:C.textMid,whiteSpace:'nowrap'}}>{v.registration}</td>
                <td style={{padding:'12px 14px'}}>
                  <div style={{fontSize:12,color:C.text}}>{v.mileage.toLocaleString()}km</div>
                  <div style={{fontSize:11,color:C.textMid}}>{v.meterCheck}</div>
                </td>
                <td style={{padding:'12px 14px'}}>
                  <div style={{fontSize:12,color:C.text}}>{v.store}</div>
                  <div style={{fontSize:11,color:C.textMid}}>{v.assignee}</div>
                </td>
                <td style={{padding:'12px 14px'}}>
                  <div style={{display:'flex',flexDirection:'column',gap:4}}>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                      {v.type!=='buynow' && <Badge color={C.orange}>オークション</Badge>}
                      {v.buyNow && <Badge color={C.blue}>即決</Badge>}
                    </div>
                    <div style={{fontSize:13,fontWeight:700,color:C.red}}>{fmt(v.price)}</div>
                    {v.type!=='buynow' && <div style={{fontSize:11,color:C.textMid}}>入札 {v.bids}件</div>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{padding:'10px 16px',borderTop:`1px solid ${C.borderLight}`}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            {[1,2,3,'…',8].map((p,i) => (
              <button key={i} style={{width:30,height:30,borderRadius:4,border:`1px solid ${p===1?C.red:C.border}`,
                background:p===1?C.red:'#fff',color:p===1?'#fff':C.textMid,fontSize:12,cursor:'pointer'}}>{p}</button>
            ))}
          </div>
        </div>
      </Card>
    </div>
  );
}

/* ─── BUYER: 通知一覧 ─── */
function Notifications() {
  const [tab, setTab] = useState('all');
  const [notifs, setNotifs] = useState(NOTIFICATIONS);
  const tabs = [['all','すべて'],['unread','未読'],['bid','入札・落札取引'],['system','システム']];
  const filtered = notifs.filter(n => {
    if(tab==='unread') return !n.read;
    if(tab==='bid') return n.type.includes('入札');
    if(tab==='system') return n.type==='システム';
    return true;
  });
  return (
    <div style={{padding:24,maxWidth:800}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',background:C.borderLight,borderRadius:6,padding:2,gap:1}}>
          {tabs.map(([v,l]) => (
            <button key={v} onClick={() => setTab(v)}
              style={{padding:'6px 14px',borderRadius:4,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
                background:tab===v?'#fff':'transparent',color:tab===v?C.red:C.textMid,
                boxShadow:tab===v?'0 1px 4px rgba(0,0,0,0.08)':'none'}}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={() => setNotifs(prev => prev.map(n => ({...n,read:true})))}
          style={{background:'none',border:`1px solid ${C.border}`,color:C.textMid,borderRadius:6,padding:'6px 14px',fontSize:12,cursor:'pointer'}}>
          すべて既読にする
        </button>
      </div>
      <Card p={0}>
        {filtered.length===0 && <div style={{padding:48,textAlign:'center',color:C.textLight}}>通知はありません</div>}
        {filtered.map((n,i) => (
          <div key={n.id} onClick={() => setNotifs(prev => prev.map(x => x.id===n.id?{...x,read:true}:x))}
            style={{display:'flex',gap:12,padding:'14px 16px',borderBottom:i<filtered.length-1?`1px solid ${C.borderLight}`:'none',
              borderLeft:`3px solid ${n.read?'transparent':C.red}`,cursor:'pointer',
              background:n.read?'#fff':'#FFFAFA',transition:'background 0.1s'}}
            onMouseEnter={e => e.currentTarget.style.background='#F9F9F9'}
            onMouseLeave={e => e.currentTarget.style.background=n.read?'#fff':'#FFFAFA'}>
            <div style={{width:8,height:8,borderRadius:'50%',background:n.read?'transparent':C.red,marginTop:7,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4,gap:12}}>
                <div style={{fontWeight:n.read?400:700,fontSize:13,color:C.text}}>{n.title}</div>
                <span style={{fontSize:11,color:C.textLight,whiteSpace:'nowrap'}}>{n.time}</span>
              </div>
              <div style={{fontSize:12,color:C.textMid,marginBottom:4}}>{n.body}</div>
              <Badge color={C.blue}>{n.type}</Badge>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

}

// 地域ごとのスケール係数（全国=1.0）
const SOUBA_REGION_SCALE = {'全国':1.0,'関東':0.42,'関西':0.28,'東海':0.18,'九州':0.14};

function getSoubaMatrix(model, region) {
  const base = SOUBA_BASE[model];
  const scale = SOUBA_REGION_SCALE[region];
  return base.map(row => row.map(v => Math.max(0, Math.round(v * scale))));
}

function SoubaMatrix() {
  const [model, setModel] = useState('Audi A4');

  const matrix = getSoubaMatrix(model, region);

  const rowTotals = matrix.map(row => row.reduce((s,v) => s+v, 0));
  const totalCars = rowTotals.reduce((s,v) => s+v, 0);

  const getCellStyle = (val) => {
    if (val === 0) return {background:'transparent', color:'transparent'};
    const ratio = val / maxVal;
    const r = 255;
    const g = Math.round(243 - ratio * (243 - 101));
    const b = Math.round(224 - ratio * 224);
    return {
      background: `rgb(${r},${g},${b})`,
      color: ratio > 0.55 ? '#fff' : '#7B3A10',
      fontWeight: 700,
    };
  };

                    width:`${barWidths[i]}%`,
                    background:r.color,
                    borderRadius:4,
                    display:'flex',alignItems:'center',paddingLeft:8,
                    transition:'width 0.5s cubic-bezier(0.4,0,0.2,1)',
                    transitionDelay:`${i*60}ms`,
                  }}>
                    <span style={{fontSize:10,color:'#fff',fontWeight:700,whiteSpace:'nowrap'}}>{(r.price/10000).toFixed(0)}万</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* ブランド別テーブル */}
      <Card>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>ブランド別地域価格比較</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['ブランド','関東（平均）','近畿（平均）','東海（平均）','差分（関東−東海）'].map(h => (
                <th key={h} style={{padding:'10px 14px',textAlign:'left',fontSize:12,fontWeight:600,color:C.textMid}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {d.brand.map(b => (
              <tr key={b.brand} style={{borderBottom:`1px solid ${C.borderLight}`}}
                onMouseEnter={e => e.currentTarget.style.background='#FAFAFA'}
                onMouseLeave={e => e.currentTarget.style.background='#fff'}>
                <td style={{padding:'10px 14px',fontSize:13,fontWeight:700}}>{b.brand}</td>
                <td style={{padding:'10px 14px',fontSize:13,fontWeight:700,color:C.red}}>{fmt(b.kanto)}</td>
                <td style={{padding:'10px 14px',fontSize:13}}>{fmt(b.kinki)}</td>
                <td style={{padding:'10px 14px',fontSize:13}}>{fmt(b.tokai)}</td>
                <td style={{padding:'10px 14px',fontSize:13,fontWeight:700,color:C.green}}>+{fmt(b.kanto-b.tokai)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {/* 相場分布マトリクス */}
      <SoubaMatrix/>
    </div>
  );
}

/* ─── 未入庫売買: 購入 ─── */
const TYPE_LABEL = {auction:'オークション', buynow:'即決', both:'オークション + 即決'};
const TYPE_COLOR = {auction:{bg:'#1565C0',text:'#fff'}, buynow:{bg:'#2E7D32',text:'#fff'}, both:{bg:'#6A1B9A',text:'#fff'}};

/* ─── 入札/即決ポップアップ ─── */
function PurchaseModal({vehicle, modalType, onClose}) {
  const [amount, setAmount] = useState(
    modalType === 'auction'
      ? String(vehicle.currentBid ? vehicle.currentBid + 100000 : vehicle.startPrice)
      : String(vehicle.buyNow)
  );
  const [submitted, setSubmitted] = useState(false);
  const [error, setError] = useState('');

  const numAmount = Number(amount.replace(/,/g, ''));
  const minBid = vehicle.currentBid ? vehicle.currentBid + 1 : vehicle.startPrice;

  const handleAmountChange = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, '');
    setAmount(raw);
    setError('');
  };

  const handleSubmit = () => {
    if (modalType === 'auction' && numAmount <= vehicle.currentBid) {
      setError(`現在の入札額（${fmt(vehicle.currentBid)}）より高い金額を入力してください`);
      return;
    }
    if (!numAmount || numAmount < 1000) {
      setError('有効な金額を入力してください');
      return;
    }
    setSubmitted(true);
  };

  const isAuction = modalType === 'auction';

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}
      onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div style={{background:'#fff',borderRadius:12,width:'100%',maxWidth:480,boxShadow:'0 20px 60px rgba(0,0,0,0.25)',overflow:'hidden',animation:'fadeInDown 0.2s ease both'}}>

        {/* ヘッダー */}
        <div style={{background: isAuction ? C.blue : C.green, padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{color:'#fff',fontWeight:700,fontSize:16}}>{isAuction ? '入札する' : '即決購入'}</div>
            <div style={{color:'rgba(255,255,255,0.8)',fontSize:12,marginTop:2}}>{vehicle.maker} {vehicle.name} {vehicle.grade}</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',borderRadius:6,width:32,height:32,color:'#fff',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>

        <div style={{padding:24}}>
          {!submitted ? (
            <>
              {/* 車両サマリー */}
              <div style={{display:'flex',gap:12,alignItems:'center',padding:'12px 14px',background:'#F8F8F8',borderRadius:8,marginBottom:20}}>
                <img src={vehicle.img} alt="" style={{width:72,height:50,borderRadius:4,objectFit:'cover',flexShrink:0}}/>
                <div>
                  <div style={{fontSize:13,fontWeight:700}}>{vehicle.maker} {vehicle.name}</div>
                  <div style={{fontSize:11,color:C.textMid}}>{vehicle.registration} · {vehicle.mileage.toLocaleString()}km</div>
                  <div style={{fontSize:11,color:C.textMid}}>{vehicle.store}</div>
                </div>
              </div>

              {/* 価格情報 */}
              {isAuction ? (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
                  <div style={{background:'#EFF6FF',borderRadius:8,padding:'10px 14px'}}>
                    <div style={{fontSize:11,color:C.textMid,marginBottom:3}}>現在の最高入札</div>
                    <div style={{fontSize:16,fontWeight:800,color:C.blue}}>{fmt(vehicle.currentBid)}</div>
                    <div style={{fontSize:10,color:C.textMid}}>{vehicle.bidCount}件の入札</div>
                  </div>
                  <div style={{background:'#F8F8F8',borderRadius:8,padding:'10px 14px'}}>
                    <div style={{fontSize:11,color:C.textMid,marginBottom:3}}>最低入札額</div>
                    <div style={{fontSize:16,fontWeight:800,color:C.text}}>{fmt(minBid)}</div>
                    <div style={{fontSize:10,color:C.textMid}}>終了: {vehicle.endDate}</div>
                  </div>
                </div>
              ) : (
                <div style={{background:'#F0FFF4',borderRadius:8,padding:'12px 16px',marginBottom:20,textAlign:'center'}}>
                  <div style={{fontSize:11,color:C.textMid,marginBottom:4}}>即決価格</div>
                  <div style={{fontSize:24,fontWeight:800,color:C.green}}>{fmt(vehicle.buyNow)}</div>
                  <div style={{fontSize:11,color:C.textMid,marginTop:4}}>この価格で即座に購入が確定します</div>
                </div>
              )}

              {/* 金額入力 */}
              <div style={{marginBottom:16}}>
                <label style={{fontSize:12,fontWeight:600,color:C.text,display:'block',marginBottom:6}}>
                  {isAuction ? '入札金額' : '購入金額（確認）'}
                </label>
                <div style={{position:'relative'}}>
                  <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:16,color:C.textMid,fontWeight:600}}>¥</span>
                  <input
                    type="text"
                    value={amount ? Number(amount).toLocaleString() : ''}
                    onChange={handleAmountChange}
                    readOnly={!isAuction}
                    style={{width:'100%',height:48,border:`2px solid ${error ? '#e53e3e' : isAuction ? C.blue : C.green}`,borderRadius:8,
                      paddingLeft:28,paddingRight:12,fontSize:18,fontWeight:700,color:C.text,
                      background: isAuction ? '#fff' : '#F9FFF9',
                      outline:'none',boxSizing:'border-box'}}
                  />
                </div>
                {isAuction && (
                  <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
                    {[100000,500000,1000000].map(step => (
                      <button key={step} onClick={() => { setAmount(String(numAmount + step)); setError(''); }}
                        style={{padding:'4px 10px',borderRadius:4,fontSize:11,fontWeight:600,border:`1px solid ${C.blue}`,
                          background:'#EFF6FF',color:C.blue,cursor:'pointer'}}>
                        +{fmt(step)}
                      </button>
                    ))}
                  </div>
                )}
                {error && <div style={{color:'#e53e3e',fontSize:11,marginTop:6}}>{error}</div>}
              </div>

              {/* ボタン */}
              <div style={{display:'flex',gap:10}}>
                <Btn variant="ghost" onClick={onClose} style={{flex:1}}>キャンセル</Btn>
                <button onClick={handleSubmit}
                  style={{flex:2,height:44,borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',border:'none',
                    background: isAuction ? C.blue : C.green, color:'#fff'}}>
                  {isAuction ? `¥${Number(amount||0).toLocaleString()} で入札する` : '購入を確定する'}
                </button>
              </div>
            </>
          ) : (
            /* 完了画面 */
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{fontSize:48,marginBottom:16}}>{isAuction ? '🎯' : '✅'}</div>
              <div style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:8}}>
                {isAuction ? '入札しました！' : '購入が完了しました！'}
              </div>
              <div style={{fontSize:13,color:C.textMid,marginBottom:4}}>
                {vehicle.maker} {vehicle.name}
              </div>
              <div style={{fontSize:22,fontWeight:800,color: isAuction ? C.blue : C.green,marginBottom:16}}>
                {fmt(numAmount)}
              </div>
              {isAuction && (
                <div style={{fontSize:12,color:C.textMid,background:'#EFF6FF',borderRadius:8,padding:'10px 14px',marginBottom:20}}>
                  他の入札があった場合は通知でお知らせします
                </div>
              )}
              <Btn onClick={onClose} style={{width:'100%',height:44,fontSize:14}}>閉じる</Btn>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function UnlistedList({setScreen}) {
  const [typeFilter, setTypeFilter] = useState('all');
  const [modal, setModal] = useState(null); // { vehicle, type: 'auction'|'buynow' }
  const filtered = typeFilter === 'all' ? UNLISTED_VEHICLES : UNLISTED_VEHICLES.filter(v => v.type === typeFilter || (typeFilter === 'auction' && v.type === 'both') || (typeFilter === 'buynow' && v.type === 'both'));

  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,padding:24}}>
    {modal && <PurchaseModal vehicle={modal.vehicle} modalType={modal.type} onClose={() => setModal(null)}/>}

      {/* フィルター */}
      <div style={{display:'flex',gap:8}}>
        {[['all','すべて'],['auction','オークション'],['buynow','即決']].map(([val,label]) => (
          <button key={val} onClick={() => setTypeFilter(val)}
            style={{padding:'6px 14px',borderRadius:4,fontSize:12,fontWeight:600,cursor:'pointer',
              background: typeFilter===val ? C.sidebarActive : C.white,
              color: typeFilter===val ? C.white : C.textMid,
              border:`1px solid ${typeFilter===val ? C.sidebarActive : C.border}`}}>
            {label}
          </button>
        ))}
      </div>

      <Card p={0}>
        <div style={{padding:'10px 16px',background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:13,color:C.textMid}}>{filtered.length}件</span>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#FAFAFA',borderBottom:`1px solid ${C.border}`}}>
              {['','メーカー / 車種名 / グレード','車体番号','初度登録','走行距離','店舗 / 担当者','取引形式 / 価格',''].map((h,i) => (
                <th key={i} style={{padding:'10px 14px',textAlign:'left',fontSize:11,fontWeight:600,color:C.textMid,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(v => {
              const tc = TYPE_COLOR[v.type];
              return (
                <tr key={v.id} style={{borderBottom:`1px solid ${C.borderLight}`}}
                  onMouseEnter={e => e.currentTarget.style.background='#FAFAFA'}
                  onMouseLeave={e => e.currentTarget.style.background='#fff'}>
                  <td style={{padding:'12px 8px',width:92}}>
                    <img src={v.img} alt="" style={{width:80,height:56,borderRadius:4,objectFit:'cover',display:'block'}}/>
                  </td>
                  <td style={{padding:'12px 14px'}}>
                    <div style={{fontSize:12,color:C.textMid}}>{v.maker}</div>
                    <div style={{fontSize:14,fontWeight:700,color:C.text}}>{v.name}</div>
                    <div style={{fontSize:11,color:C.textMid}}>{v.grade}</div>
                  </td>
                  <td style={{padding:'12px 14px',fontSize:12,fontFamily:'monospace',color:C.text}}>{v.vin}</td>
                  <td style={{padding:'12px 14px',fontSize:12,color:C.textMid,whiteSpace:'nowrap'}}>{v.registration}</td>
                  <td style={{padding:'12px 14px'}}>
                    <div style={{fontSize:12}}>{v.mileage.toLocaleString()}km</div>
                    <div style={{fontSize:11,color:C.textMid}}>{v.meterCheck}</div>
                  </td>
                  <td style={{padding:'12px 14px'}}>
                    <div style={{fontSize:12}}>{v.store}</div>
                    <div style={{fontSize:11,color:C.textMid}}>{v.assignee}</div>
                  </td>
                  <td style={{padding:'12px 14px',minWidth:180}}>
                    {/* 取引形式バッジ */}
                    <span style={{display:'inline-block',padding:'2px 7px',borderRadius:3,fontSize:10,fontWeight:700,background:tc.bg,color:tc.text,marginBottom:6}}>
                      {TYPE_LABEL[v.type]}
                    </span>
                    {/* オークション情報 */}
                    {(v.type==='auction'||v.type==='both') && v.currentBid && (
                      <div style={{marginBottom: v.type==='both' ? 6 : 0}}>
                        <div style={{fontSize:11,color:C.textMid}}>現在の入札</div>
                        <div style={{fontSize:14,fontWeight:700,color:C.blue}}>{fmt(v.currentBid)}</div>
                        <div style={{fontSize:10,color:C.textMid}}>{v.bidCount}件の入札 · {v.endDate}終了</div>
                      </div>
                    )}
                    {/* 即決価格 */}
                    {(v.type==='buynow'||v.type==='both') && v.buyNow && (
                      <div>
                        {v.type==='both' && <div style={{fontSize:11,color:C.textMid,marginBottom:1}}>即決価格</div>}
                        <div style={{fontSize:14,fontWeight:700,color:C.green}}>{fmt(v.buyNow)}</div>
                      </div>
                    )}
                  </td>
                  <td style={{padding:'12px 14px'}}>
                    <div style={{display:'flex',flexDirection:'column',gap:6}}>
                      {(v.type==='auction'||v.type==='both') && (
                        <Btn onClick={() => setModal({vehicle:v, type:'auction'})} style={{height:30,fontSize:11,background:C.blue,whiteSpace:'nowrap'}}>入札する</Btn>
                      )}
                      {(v.type==='buynow'||v.type==='both') && (
                        <Btn onClick={() => setModal({vehicle:v, type:'buynow'})} style={{height:30,fontSize:11,background:C.green,whiteSpace:'nowrap'}}>即決購入</Btn>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* ─── PAGE TITLES ─── */
const PAGE_TITLES = {
  'buyer-list':'車両一覧',
  'buyer-detail':'車両詳細',
  'buyer-detail-buynow':'車両詳細（即決）',
  'tx-list':'取引中（購入）',
  'tx-detail':'取引詳細',
  'notifications':'通知一覧',
  'mypage':'マイページ',
  'seller-list':'出品管理',
  'seller-detail':'車両詳細（出品）',
  'seller-new':'新規出品',
  'unlisted-list':'未入庫車両購入',
  'price-negotiation':'価格交渉',
  'admin-dashboard':'ダッシュボード',
  'admin-regional':'地域別価格分析',
};

/* ─── APP ROOT ─── */
function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [role, setRole] = useState('user');
  const [screen, setScreen] = useState('buyer-list');
  const [selectedVehicle, setSelectedVehicle] = useState(null);
  const [selectedUnlisted, setSelectedUnlisted] = useState(null);

  const handleLogin = r => {
    setRole(r);
    setScreen(r==='admin'?'admin-dashboard':'buyer-list');
    setLoggedIn(true);
  };

  if(!loggedIn) return <LoginScreen onLogin={handleLogin}/>;

  const renderScreen = () => {
    switch(screen) {
      case 'buyer-list': return <BuyerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'buyer-detail': return <BuyerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'buyer-detail-buynow': return <BuyerDetailBuyNow vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'tx-list': return <TxList setScreen={setScreen}/>;
      case 'tx-detail': return <TxDetail setScreen={setScreen}/>;
      case 'notifications': return <Notifications/>;
      case 'mypage': return <MyPage/>;
      case 'seller-list': return <SellerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
      case 'seller-detail': return <SellerDetail vehicle={selectedVehicle} setScreen={setScreen}/>;
      case 'seller-new': return <SellerNewListing setScreen={setScreen}/>;
      case 'unlisted-list': return <UnlistedList setScreen={setScreen} setSelectedUnlisted={setSelectedUnlisted}/>;
      case 'price-negotiation': return <PriceNegotiation vehicle={selectedUnlisted} setScreen={setScreen}/>;
      case 'admin-dashboard': return <AdminDashboard setScreen={setScreen}/>;
      case 'admin-regional': return <AdminRegional/>;
      default: return <BuyerList setScreen={setScreen} setSelectedVehicle={setSelectedVehicle}/>;
    }
  };

  return (
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar role={role} screen={screen} setScreen={setScreen} setRole={setRole}/>
      <div style={{flex:1,overflowY:'auto',overflowX:'hidden',minWidth:0}}>
        {renderScreen()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
